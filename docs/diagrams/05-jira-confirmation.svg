<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="2070" viewBox="0 0 1440 2070" aria-label="05 · Jira 业务：主助手、用户确认与实际提交"><defs><marker id="05irasvg-normal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#527894"/></marker><marker id="05irasvg-return" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#39775f"/></marker><marker id="05irasvg-retry" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#a77a31"/></marker><marker id="05irasvg-stop" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#b05847"/></marker><style>text{font-family:"Microsoft YaHei","PingFang SC",sans-serif;fill:#223b50}.body{font-size:20px}.title{font-size:23px;font-weight:700}.lineLabel{font-size:18px}.node:hover{filter:brightness(.97);cursor:pointer}.node:focus{outline:none}.node:focus rect,.node.selected rect{stroke-width:4}</style></defs><rect width="1440" height="2070" fill="#f8fafc"/><text x="40" y="48" style="font-size:32px;font-weight:700">05 · Jira 业务：主助手、用户确认与实际提交</text><text x="40" y="84" style="font-size:19px;fill:#617789">当前实现 · 2026-10-04 · 主助手委派式协作 · 点击节点查看说明</text><rect x="40" y="115" width="390" height="1845" rx="17" fill="#ffffff" stroke="#dde5ed"/><rect x="40" y="115" width="390" height="72" rx="17" fill="#e0eaf6"/><text x="235" y="145" text-anchor="middle" class="title">主助手与工具治理</text><text x="235" y="173" text-anchor="middle" style="font-size:16px;fill:#647a8e">业务规划 · 实际 callable 边界</text><rect x="550" y="115" width="420" height="1845" rx="17" fill="#ffffff" stroke="#dde5ed"/><rect x="550" y="115" width="420" height="72" rx="17" fill="#fff0d3"/><text x="760" y="145" text-anchor="middle" class="title">用户与确认界面</text><text x="760" y="173" text-anchor="middle" style="font-size:16px;fill:#647a8e">可编辑预览 · 当前请求有效确认</text><rect x="1060" y="115" width="360" height="1845" rx="17" fill="#ffffff" stroke="#dde5ed"/><rect x="1060" y="115" width="360" height="72" rx="17" fill="#edf1f5"/><text x="1240" y="145" text-anchor="middle" class="title">Jira MCP 与 API</text><text x="1240" y="173" text-anchor="middle" style="font-size:16px;fill:#647a8e">业务工具 · 不是第四个 Agent</text><path d="M235 350 L235 435" fill="none" stroke="#527894" stroke-width="2.6" stroke-linejoin="round"  marker-end="url(#05irasvg-normal)"/><text x="250" y="392" class="lineLabel" style="fill:#527894;paint-order:stroke;stroke:#f8fafc;stroke-width:6px;stroke-linejoin:round">创建请求</text><path d="M410 500 L1080 500" fill="none" stroke="#527894" stroke-width="2.6" stroke-linejoin="round"  marker-end="url(#05irasvg-normal)"/><text x="715" y="480" class="lineLabel" style="fill:#527894;paint-order:stroke;stroke:#f8fafc;stroke-width:6px;stroke-linejoin:round">查询</text><path d="M1080 560 L1010 560 L1010 630 L235 630 L235 735" fill="none" stroke="#39775f" stroke-width="2.6" stroke-linejoin="round"  marker-end="url(#05irasvg-return)"/><text x="674" y="615" class="lineLabel" style="fill:#39775f;paint-order:stroke;stroke:#f8fafc;stroke-width:6px;stroke-linejoin:round">真实上下文</text><path d="M410 580 L500 580 L500 715 L570 715" fill="none" stroke="#527894" stroke-width="2.6" stroke-linejoin="round"  marker-end="url(#05irasvg-normal)"/><text x="465" y="675" class="lineLabel" style="fill:#527894;paint-order:stroke;stroke:#f8fafc;stroke-width:6px;stroke-linejoin:round">需要选择</text><path d="M570 685 L470 685 L470 525 L410 525" fill="none" stroke="#39775f" stroke-width="2.6" stroke-linejoin="round"  marker-end="url(#05irasvg-return)"/><text x="482" y="651" class="lineLabel" style="fill:#39775f;paint-order:stroke;stroke:#f8fafc;stroke-width:6px;stroke-linejoin:round">选择项目</text><path d="M410 815 L500 815 L500 995 L570 995" fill="none" stroke="#527894" stroke-width="2.6" stroke-linejoin="round"  marker-end="url(#05irasvg-normal)"/><text x="463" y="947" class="lineLabel" style="fill:#527894;paint-order:stroke;stroke:#f8fafc;stroke-width:6px;stroke-linejoin:round">预览与等待</text><path d="M760 1080 L760 1180" fill="none" stroke="#527894" stroke-width="2.6" stroke-linejoin="round"  marker-end="url(#05irasvg-normal)"/><path d="M605 1245 L410 1258" fill="none" stroke="#b05847" stroke-width="2.6" stroke-linejoin="round"  marker-end="url(#05irasvg-stop)"/><text x="488" y="1224" class="lineLabel" style="fill:#b05847;paint-order:stroke;stroke:#f8fafc;stroke-width:6px;stroke-linejoin:round">取消</text><path d="M760 1310 L760 1420" fill="none" stroke="#527894" stroke-width="2.6" stroke-linejoin="round"  marker-end="url(#05irasvg-normal)"/><text x="776" y="1369" class="lineLabel" style="fill:#527894;paint-order:stroke;stroke:#f8fafc;stroke-width:6px;stroke-linejoin:round">尚未确认</text><path d="M605 1280 L470 1280 L470 1505 L410 1505" fill="none" stroke="#527894" stroke-width="2.6" stroke-linejoin="round"  marker-end="url(#05irasvg-normal)"/><text x="479" y="1402" class="lineLabel" style="fill:#527894;paint-order:stroke;stroke:#f8fafc;stroke-width:6px;stroke-linejoin:round">确认并校验</text><path d="M410 1555 L480 1555 L480 1645 L1080 1645" fill="none" stroke="#527894" stroke-width="2.6" stroke-linejoin="round"  marker-end="url(#05irasvg-normal)"/><text x="630" y="1625" class="lineLabel" style="fill:#527894;paint-order:stroke;stroke:#f8fafc;stroke-width:6px;stroke-linejoin:round">有效确认后的最终参数</text><path d="M1080 1725 L1010 1725 L1010 1855 L410 1855" fill="none" stroke="#39775f" stroke-width="2.6" stroke-linejoin="round"  marker-end="url(#05irasvg-return)"/><text x="690" y="1835" class="lineLabel" style="fill:#39775f;paint-order:stroke;stroke:#f8fafc;stroke-width:6px;stroke-linejoin:round">真实执行结果</text><path d="M60 1265 L30 1265 L30 1840 L60 1840" fill="none" stroke="#b05847" stroke-width="2.6" stroke-linejoin="round"  marker-end="url(#05irasvg-stop)"/><text x="41" y="1732" class="lineLabel" style="fill:#b05847;paint-order:stroke;stroke:#f8fafc;stroke-width:6px;stroke-linejoin:round">取消结果</text><g class="node" data-node="jgoal" role="button" tabindex="0"><title>主助手识别实际 Jira 目标；读取业务目标与拟提交字段；普通读取可直接使用授权工具；写操作进入具体内容确认流程</title><rect x="60" y="220" width="350" height="130" rx="14" fill="#e7f0fa" stroke="#719dc7" stroke-width="1.8"/><rect x="60" y="234" width="5" height="102" rx="2" fill="#205984"/><text x="80" y="255" class="title">主助手识别实际 Jira 目标</text><text x="80" y="286" class="body">读取业务目标与拟提交字段</text><text x="80" y="313" class="body">普通读取可直接使用授权工具</text><text x="80" y="340" class="body">写操作进入具体内容确认流程</text></g><g class="node" data-node="jcontext" role="button" tabindex="0"><title>创建前读取真实上下文；get_jira_create_context；真实项目、创建权限、工单类型；多项目且未指定：用户选择；不猜项目 Key 或示例工单类型</title><rect x="60" y="435" width="350" height="170" rx="14" fill="#e7f0fa" stroke="#719dc7" stroke-width="1.8"/><rect x="60" y="449" width="5" height="142" rx="2" fill="#205984"/><text x="80" y="470" class="title">创建前读取真实上下文</text><text x="80" y="501" class="body">get_jira_create_context</text><text x="80" y="528" class="body">真实项目、创建权限、工单类型</text><text x="80" y="555" class="body">多项目且未指定：用户选择</text><text x="80" y="582" class="body">不猜项目 Key 或示例工单类型</text></g><g class="node" data-node="jmetadata" role="button" tabindex="0"><title>Jira 元数据与权限；返回真实项目和类型；创建权限与连接状态；失败时说明实际原因</title><rect x="1080" y="435" width="320" height="140" rx="14" fill="#f1f4f7" stroke="#a3b3c3" stroke-width="1.8"/><rect x="1080" y="449" width="5" height="112" rx="2" fill="#526c82"/><text x="1100" y="470" class="title">Jira 元数据与权限</text><text x="1100" y="501" class="body">返回真实项目和类型</text><text x="1100" y="528" class="body">创建权限与连接状态</text><text x="1100" y="555" class="body">失败时说明实际原因</text></g><g class="node" data-node="jchoose" role="button" tabindex="0"><title>用户按实际列表选择项目；有多个项目且尚未指定时出现；选择结果回到主助手</title><rect x="570" y="655" width="380" height="120" rx="14" fill="#e7f0fa" stroke="#719dc7" stroke-width="1.8"/><rect x="570" y="669" width="5" height="92" rx="2" fill="#205984"/><text x="590" y="690" class="title">用户按实际列表选择项目</text><text x="590" y="721" class="body">有多个项目且尚未指定时出现</text><text x="590" y="748" class="body">选择结果回到主助手</text></g><g class="node" data-node="jpolicy" role="button" tabindex="0"><title>写工具边界治理；策略校验，删除操作直接拒绝；登记待确认请求与审计；准备本次具体写入内容；等待本用户的有效确认</title><rect x="60" y="735" width="350" height="160" rx="14" fill="#fff3dc" stroke="#d1af69" stroke-width="1.8"/><rect x="60" y="749" width="5" height="132" rx="2" fill="#896222"/><text x="80" y="770" class="title">写工具边界治理</text><text x="80" y="801" class="body">策略校验，删除操作直接拒绝</text><text x="80" y="828" class="body">登记待确认请求与审计</text><text x="80" y="855" class="body">准备本次具体写入内容</text><text x="80" y="882" class="body">等待本用户的有效确认</text></g><g class="node" data-node="jform" role="button" tabindex="0"><title>这是用户确认界面，不是一个新 Agent。修改字段后应使用实际确认的最终参数提交，而不是原模型草稿。</title><rect x="570" y="915" width="380" height="165" rx="14" fill="#fff3dc" stroke="#d1af69" stroke-width="1.8"/><rect x="570" y="929" width="5" height="137" rx="2" fill="#896222"/><text x="590" y="950" class="title">可编辑确认表单</text><text x="590" y="981" class="body">展示本次项目、标题、描述等</text><text x="590" y="1008" class="body">用户可修改最终提交字段</text><text x="590" y="1035" class="body">绑定本次 request_id 与对话</text><text x="590" y="1062" class="body">背景点击保留草稿</text></g><g class="node" data-node="jconfirm" role="button" tabindex="0"><title>用户有效确认？</title><path d="M760 1180L915 1245L760 1310L605 1245Z" fill="#fff3dc" stroke="#d1af69" stroke-width="2"/><text x="760" y="1252" text-anchor="middle" class="title">用户有效确认？</text></g><g class="node" data-node="jcancel" role="button" tabindex="0"><title>取消 / 关闭 / Escape；CANCELLED；未执行写入；execution_performed=false；本用户轮后续 Jira 写入停止；新用户轮按新请求重新评估</title><rect x="60" y="1185" width="350" height="155" rx="14" fill="#fff0ed" stroke="#ca8c80" stroke-width="1.8"/><rect x="60" y="1199" width="5" height="127" rx="2" fill="#a24838"/><text x="80" y="1220" class="title">取消 / 关闭 / Escape</text><text x="80" y="1251" class="body">CANCELLED；未执行写入</text><text x="80" y="1278" class="body">execution_performed=false</text><text x="80" y="1305" class="body">本用户轮后续 Jira 写入停止</text><text x="80" y="1332" class="body">新用户轮按新请求重新评估</text></g><g class="node" data-node="jwaiting" role="button" tabindex="0"><title>没有有效确认：继续等待；WAITING_FOR_APPROVAL；不执行 Jira API 写入</title><rect x="570" y="1420" width="380" height="115" rx="14" fill="#fff3dc" stroke="#d1af69" stroke-width="1.8"/><rect x="570" y="1434" width="5" height="87" rx="2" fill="#896222"/><text x="590" y="1455" class="title">没有有效确认：继续等待</text><text x="590" y="1486" class="body">WAITING_FOR_APPROVAL</text><text x="590" y="1513" class="body">不执行 Jira API 写入</text></g><g class="node" data-node="jvalidate" role="button" tabindex="0"><title>确认结果与编辑后参数校验；核对字段及本次 request_id；核对当前用户、聊天、工作流；有效确认后才执行；无效确认：报告原因，保持未执行</title><rect x="60" y="1450" width="350" height="165" rx="14" fill="#e7f0fa" stroke="#719dc7" stroke-width="1.8"/><rect x="60" y="1464" width="5" height="137" rx="2" fill="#205984"/><text x="80" y="1485" class="title">确认结果与编辑后参数校验</text><text x="80" y="1516" class="body">核对字段及本次 request_id</text><text x="80" y="1543" class="body">核对当前用户、聊天、工作流</text><text x="80" y="1570" class="body">有效确认后才执行</text><text x="80" y="1597" class="body">无效确认：报告原因，保持未执行</text></g><g class="node" data-node="jexecute" role="button" tabindex="0"><title>使用最终参数执行 Jira；创建时再次检查权限和类型；调用实际 Jira REST API；提交成功和确认成功分别判断；API 失败返回真实原因</title><rect x="1080" y="1590" width="320" height="175" rx="14" fill="#f1f4f7" stroke="#a3b3c3" stroke-width="1.8"/><rect x="1080" y="1604" width="5" height="147" rx="2" fill="#526c82"/><text x="1100" y="1625" class="title">使用最终参数执行 Jira</text><text x="1100" y="1656" class="body">创建时再次检查权限和类型</text><text x="1100" y="1683" class="body">调用实际 Jira REST API</text><text x="1100" y="1710" class="body">提交成功和确认成功分别判断</text><text x="1100" y="1737" class="body">API 失败返回真实原因</text></g><g class="node" data-node="jresult" role="button" tabindex="0"><title>主助手按实际提交结果汇报；真实工单信息或实际失败；用户编辑时按实际参数汇报；submitted_arguments 可核对；不把等待或取消描述为成功</title><rect x="60" y="1775" width="350" height="165" rx="14" fill="#e7f5ed" stroke="#70aa86" stroke-width="1.8"/><rect x="60" y="1789" width="5" height="137" rx="2" fill="#2c7448"/><text x="80" y="1810" class="title">主助手按实际提交结果汇报</text><text x="80" y="1841" class="body">真实工单信息或实际失败</text><text x="80" y="1868" class="body">用户编辑时按实际参数汇报</text><text x="80" y="1895" class="body">submitted_arguments 可核对</text><text x="80" y="1922" class="body">不把等待或取消描述为成功</text></g><text x="40" y="2002" style="font-size:18px;fill:#60778a">Jira 分支按用户业务目标选择；知识库资料编号不能仅因外观类似工单号就改走 Jira。</text><text x="40" y="2029" style="font-size:18px;fill:#60778a">当前强制确认覆盖配置中的 Jira 写工具；这不代表所有 shell、Git 或发布操作都有同样的强制审批。</text></svg>
