<svg xmlns="http://www.w3.org/2000/svg" width="1590" height="1980" viewBox="0 0 1590 1980" aria-label="03 · 编码 Agent：参数、授权与实际执行"><defs><marker id="03gentsvg-normal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#527894"/></marker><marker id="03gentsvg-return" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#39775f"/></marker><marker id="03gentsvg-retry" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#a77a31"/></marker><marker id="03gentsvg-stop" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#b05847"/></marker><style>text{font-family:"Microsoft YaHei","PingFang SC",sans-serif;fill:#223b50}.body{font-size:20px}.title{font-size:23px;font-weight:700}.lineLabel{font-size:18px}.node:hover{filter:brightness(.97);cursor:pointer}.node:focus{outline:none}.node:focus rect,.node.selected rect{stroke-width:4}</style></defs><rect width="1590" height="1980" fill="#f8fafc"/><text x="40" y="48" style="font-size:32px;font-weight:700">03 · 编码 Agent：参数、授权与实际执行</text><text x="40" y="84" style="font-size:19px;fill:#617789">当前实现 · 2026-10-04 · 主助手委派式协作 · 点击节点查看说明</text><rect x="40" y="115" width="380" height="1755" rx="17" fill="#ffffff" stroke="#dde5ed"/><rect x="40" y="115" width="380" height="72" rx="17" fill="#e0eaf6"/><text x="230" y="145" text-anchor="middle" class="title">主助手与失败出口</text><text x="230" y="173" text-anchor="middle" style="font-size:16px;fill:#647a8e">参数纠正 · 实际结果汇报</text><rect x="510" y="115" width="620" height="1755" rx="17" fill="#ffffff" stroke="#dde5ed"/><rect x="510" y="115" width="620" height="72" rx="17" fill="#e4e8f7"/><text x="820" y="145" text-anchor="middle" class="title">编码 Agent 独立执行上下文</text><text x="820" y="173" text-anchor="middle" style="font-size:16px;fill:#647a8e">Claude Agent SDK · 本任务工具循环</text><rect x="1190" y="115" width="380" height="1755" rx="17" fill="#ffffff" stroke="#dde5ed"/><rect x="1190" y="115" width="380" height="72" rx="17" fill="#edf1f5"/><text x="1380" y="145" text-anchor="middle" class="title">终端与验收衔接</text><text x="1380" y="173" text-anchor="middle" style="font-size:16px;fill:#647a8e">已授权工具 · 独立验收</text><path d="M400 295 L600 295" fill="none" stroke="#527894" stroke-width="2.6" stroke-linejoin="round"  marker-end="url(#03gentsvg-normal)"/><text x="458" y="279" class="lineLabel" style="fill:#527894;paint-order:stroke;stroke:#f8fafc;stroke-width:6px;stroke-linejoin:round">参数</text><path d="M600 295 L450 295 L450 495 L400 495" fill="none" stroke="#a77a31" stroke-width="2.6" stroke-linejoin="round" stroke-dasharray="8 5" marker-end="url(#03gentsvg-retry)"/><text x="463" y="397" class="lineLabel" style="fill:#a77a31;paint-order:stroke;stroke:#f8fafc;stroke-width:6px;stroke-linejoin:round">无效</text><path d="M400 465 L475 465 L475 325 L600 325" fill="none" stroke="#a77a31" stroke-width="2.6" stroke-linejoin="round" stroke-dasharray="8 5" marker-end="url(#03gentsvg-retry)"/><text x="446" y="416" class="lineLabel" style="fill:#a77a31;paint-order:stroke;stroke:#f8fafc;stroke-width:6px;stroke-linejoin:round">修正后重新调用</text><path d="M820 355 L820 435" fill="none" stroke="#527894" stroke-width="2.6" stroke-linejoin="round"  marker-end="url(#03gentsvg-normal)"/><text x="837" y="400" class="lineLabel" style="fill:#527894;paint-order:stroke;stroke:#f8fafc;stroke-width:6px;stroke-linejoin:round">合法</text><path d="M820 575 L820 675" fill="none" stroke="#527894" stroke-width="2.6" stroke-linejoin="round"  marker-end="url(#03gentsvg-normal)"/><path d="M820 840 L820 935" fill="none" stroke="#527894" stroke-width="2.6" stroke-linejoin="round"  marker-end="url(#03gentsvg-normal)"/><path d="M820 1100 L820 1195" fill="none" stroke="#527894" stroke-width="2.6" stroke-linejoin="round"  marker-end="url(#03gentsvg-normal)"/><path d="M1110 1260 L1210 1260" fill="none" stroke="#527894" stroke-width="2.6" stroke-linejoin="round"  marker-end="url(#03gentsvg-normal)"/><text x="1140" y="1244" class="lineLabel" style="fill:#527894;paint-order:stroke;stroke:#f8fafc;stroke-width:6px;stroke-linejoin:round">请求</text><path d="M1210 1325 L1110 1325" fill="none" stroke="#39775f" stroke-width="2.6" stroke-linejoin="round"  marker-end="url(#03gentsvg-return)"/><text x="1140" y="1310" class="lineLabel" style="fill:#39775f;paint-order:stroke;stroke:#f8fafc;stroke-width:6px;stroke-linejoin:round">观察</text><path d="M820 1370 L820 1465" fill="none" stroke="#527894" stroke-width="2.6" stroke-linejoin="round"  marker-end="url(#03gentsvg-normal)"/><path d="M600 1530 L400 1560" fill="none" stroke="#b05847" stroke-width="2.6" stroke-linejoin="round"  marker-end="url(#03gentsvg-stop)"/><text x="483" y="1515" class="lineLabel" style="fill:#b05847;paint-order:stroke;stroke:#f8fafc;stroke-width:6px;stroke-linejoin:round">否</text><path d="M820 1595 L820 1690" fill="none" stroke="#527894" stroke-width="2.6" stroke-linejoin="round"  marker-end="url(#03gentsvg-normal)"/><text x="836" y="1640" class="lineLabel" style="fill:#527894;paint-order:stroke;stroke:#f8fafc;stroke-width:6px;stroke-linejoin:round">是</text><path d="M1110 1755 L1210 1755" fill="none" stroke="#527894" stroke-width="2.6" stroke-linejoin="round"  marker-end="url(#03gentsvg-normal)"/><text x="1140" y="1738" class="lineLabel" style="fill:#527894;paint-order:stroke;stroke:#f8fafc;stroke-width:6px;stroke-linejoin:round">检查</text><path d="M1210 1810 L1155 1810 L1155 1350 L1110 1350" fill="none" stroke="#a77a31" stroke-width="2.6" stroke-linejoin="round" stroke-dasharray="8 5" marker-end="url(#03gentsvg-retry)"/><text x="1160" y="1572" class="lineLabel" style="fill:#a77a31;paint-order:stroke;stroke:#f8fafc;stroke-width:6px;stroke-linejoin:round">仍有预算：真实错误＋截图</text><path d="M60 570 L25 570 L25 1760 L60 1760" fill="none" stroke="#b05847" stroke-width="2.6" stroke-linejoin="round"  marker-end="url(#03gentsvg-stop)"/><text x="40" y="1405" class="lineLabel" style="fill:#b05847;paint-order:stroke;stroke:#f8fafc;stroke-width:6px;stroke-linejoin:round">纠错耗尽</text><path d="M230 1635 L230 1720" fill="none" stroke="#b05847" stroke-width="2.6" stroke-linejoin="round"  marker-end="url(#03gentsvg-stop)"/><text x="246" y="1680" class="lineLabel" style="fill:#b05847;paint-order:stroke;stroke:#f8fafc;stroke-width:6px;stroke-linejoin:round">报告未完成</text><g class="node" data-node="cinput" role="button" tabindex="0"><title>repo 默认 .。本地 HTML/SVG 使用项目相对 preview_target；纯绘图 verification_commands=[]。主助手最多纠正两次参数错误。</title><rect x="60" y="215" width="340" height="160" rx="14" fill="#e7f0fa" stroke="#719dc7" stroke-width="1.8"/><rect x="60" y="229" width="5" height="132" rx="2" fill="#205984"/><text x="80" y="250" class="title">主助手提交编码任务</text><text x="80" y="281" class="body">task / repo / context</text><text x="80" y="308" class="body">acceptance / read_only</text><text x="80" y="335" class="body">verification_commands</text><text x="80" y="362" class="body">preview_target</text></g><g class="node" data-node="cargs" role="button" tabindex="0"><title>委派参数合法？</title><path d="M820 230L1040 292.5L820 355L600 292.5Z" fill="#fff3dc" stroke="#d1af69" stroke-width="2"/><text x="820" y="299.5" text-anchor="middle" class="title">委派参数合法？</text></g><g class="node" data-node="cinvalid" role="button" tabindex="0"><title>这是尚未开始执行的参数错误，不消耗编码验收修复次数。纠错预算耗尽时结束本轮；工具不会在第一次参数错误后被误移除。</title><rect x="60" y="435" width="340" height="165" rx="14" fill="#fff3dc" stroke="#d1af69" stroke-width="1.8"/><rect x="60" y="449" width="5" height="137" rx="2" fill="#896222"/><text x="80" y="470" class="title">参数错误：尚未启动</text><text x="80" y="501" class="body">status=invalid_arguments</text><text x="80" y="528" class="body">execution_started=false</text><text x="80" y="555" class="body">retryable=true / correction</text><text x="80" y="582" class="body">纠正参数最多 2 次</text></g><g class="node" data-node="cauth" role="button" tabindex="0"><title>用户与终端授权、项目路径；OWUI 检查本用户对连接的授权；repo 与预览文件必须在项目范围内；不向 Agent 传递终端凭据</title><rect x="530" y="435" width="580" height="140" rx="14" fill="#eceefa" stroke="#929fce" stroke-width="1.8"/><rect x="530" y="449" width="5" height="112" rx="2" fill="#465e9c"/><text x="550" y="470" class="title">用户与终端授权、项目路径</text><text x="550" y="501" class="body">OWUI 检查本用户对连接的授权</text><text x="550" y="528" class="body">repo 与预览文件必须在项目范围内</text><text x="550" y="555" class="body">不向 Agent 传递终端凭据</text></g><g class="node" data-node="clock" role="button" tabindex="0"><title>排队并确认真实工作区；按 terminal_id 获取进程内锁；防止本进程的任务同时改工作区；检查目录存在与真实符号链接路径；当前不是跨服务分布式锁</title><rect x="530" y="675" width="580" height="165" rx="14" fill="#eceefa" stroke="#929fce" stroke-width="1.8"/><rect x="530" y="689" width="5" height="137" rx="2" fill="#465e9c"/><text x="550" y="710" class="title">排队并确认真实工作区</text><text x="550" y="741" class="body">按 terminal_id 获取进程内锁</text><text x="550" y="768" class="body">防止本进程的任务同时改工作区</text><text x="550" y="795" class="body">检查目录存在与真实符号链接路径</text><text x="550" y="822" class="body">当前不是跨服务分布式锁</text></g><g class="node" data-node="csnapshot" role="button" tabindex="0"><title>命令在编码开始前固定。不能用 echo、ls、吞掉失败、管道等代替真实验收；原测试需保留时额外检查其未变。</title><rect x="530" y="935" width="580" height="165" rx="14" fill="#eceefa" stroke="#929fce" stroke-width="1.8"/><rect x="530" y="949" width="5" height="137" rx="2" fill="#465e9c"/><text x="550" y="970" class="title">初始快照与验收准备</text><text x="550" y="1001" class="body">独立记录项目文件 SHA256</text><text x="550" y="1028" class="body">固定测试 / 构建命令</text><text x="550" y="1055" class="body">按项目发现已有检查；校验命令</text><text x="550" y="1082" class="body">纯本地 HTML/SVG 可用浏览器验收</text></g><g class="node" data-node="csdk" role="button" tabindex="0"><title>计时区间是 SDK 运行与验收修复；前置授权、快照与等待工作区锁不计入 600 秒。SDK 是框架，当前编码模型 qwen3.7-plus。</title><rect x="530" y="1195" width="580" height="175" rx="14" fill="#eceefa" stroke="#929fce" stroke-width="1.8"/><rect x="530" y="1209" width="5" height="147" rx="2" fill="#465e9c"/><text x="550" y="1230" class="title">启动独立 Claude Agent SDK 会话</text><text x="550" y="1261" class="body">只接收本次任务与必要上下文</text><text x="550" y="1288" class="body">模型选择工具 → 观察结果 → 继续</text><text x="550" y="1315" class="body">单轮 MAX_TURNS 默认 20</text><text x="550" y="1342" class="body">SDK＋验收修复区间默认 600 秒</text></g><g class="node" data-node="cterminal" role="button" tabindex="0"><title>SDK 原生 Read/Edit/Bash 未启用。Terminal 工具由 OWUI 当前授权连接提供；固定 cwd 不等于任意 shell 完全安全隔离。</title><rect x="1210" y="1195" width="340" height="175" rx="14" fill="#f1f4f7" stroke="#a3b3c3" stroke-width="1.8"/><rect x="1210" y="1209" width="5" height="147" rx="2" fill="#526c82"/><text x="1230" y="1230" class="title">当前获准的终端工具</text><text x="1230" y="1261" class="body">read_file / write_file / 查找</text><text x="1230" y="1288" class="body">run_command / 进程结果</text><text x="1230" y="1315" class="body">写路径检查、命令固定 cwd</text><text x="1230" y="1342" class="body">实际结果回到同一模型会话</text></g><g class="node" data-node="csuccess" role="button" tabindex="0"><title>SDK 正常成功结束？</title><path d="M820 1465L1040 1530L820 1595L600 1530Z" fill="#fff3dc" stroke="#d1af69" stroke-width="2"/><text x="820" y="1537" text-anchor="middle" class="title">SDK 正常成功结束？</text></g><g class="node" data-node="cfailed" role="button" tabindex="0"><title>SDK 错误、异常和超时直接走失败出口，不进入独立验收的两次修复循环；主助手直接生成确定性未完成通知。</title><rect x="60" y="1490" width="340" height="145" rx="14" fill="#fff0ed" stroke="#ca8c80" stroke-width="1.8"/><rect x="60" y="1504" width="5" height="117" rx="2" fill="#a24838"/><text x="80" y="1525" class="title">执行失败或超时</text><text x="80" y="1556" class="body">status=failed</text><text x="80" y="1583" class="body">报告真实原因和已有改动</text><text x="80" y="1610" class="body">结束本轮编码委派</text></g><g class="node" data-node="cverify" role="button" tabindex="0"><title>交给独立验收模块；读取真实改动、测试与页面结果；详细检查与交付见图 4；完成声明由验收结果决定</title><rect x="530" y="1690" width="580" height="130" rx="14" fill="#fff3dc" stroke="#d1af69" stroke-width="1.8"/><rect x="530" y="1704" width="5" height="102" rx="2" fill="#896222"/><text x="550" y="1725" class="title">交给独立验收模块</text><text x="550" y="1756" class="body">读取真实改动、测试与页面结果</text><text x="550" y="1783" class="body">详细检查与交付见图 4</text><text x="550" y="1810" class="body">完成声明由验收结果决定</text></g><g class="node" data-node="vstub" role="button" tabindex="0"><title>验收反馈 / 最终报告；不通过且有次数：原会话修复；通过：completed；耗尽：verification_failed</title><rect x="1210" y="1675" width="340" height="150" rx="14" fill="#fff3dc" stroke="#d1af69" stroke-width="1.8"/><rect x="1210" y="1689" width="5" height="122" rx="2" fill="#896222"/><text x="1230" y="1710" class="title">验收反馈 / 最终报告</text><text x="1230" y="1741" class="body">不通过且有次数：原会话修复</text><text x="1230" y="1768" class="body">通过：completed</text><text x="1230" y="1795" class="body">耗尽：verification_failed</text></g><g class="node" data-node="cstop" role="button" tabindex="0"><title>参数纠错耗尽 / 失败；如实报告未完成；保留实际错误、文件与证据；同轮不重复委派绕过上限</title><rect x="60" y="1720" width="340" height="140" rx="14" fill="#fff0ed" stroke="#ca8c80" stroke-width="1.8"/><rect x="60" y="1734" width="5" height="112" rx="2" fill="#a24838"/><text x="80" y="1755" class="title">参数纠错耗尽 / 失败</text><text x="80" y="1786" class="body">如实报告未完成</text><text x="80" y="1813" class="body">保留实际错误、文件与证据</text><text x="80" y="1840" class="body">同轮不重复委派绕过上限</text></g><text x="40" y="1912" style="font-size:18px;fill:#60778a">参数纠正预算与编码后的验收修复预算分别计算；前者尚未启动 SDK。</text><text x="40" y="1939" style="font-size:18px;fill:#60778a">只读分析和文档任务按实际要求选择检查；普通程序文件主要保存在 OpenTerminal 工作区。</text></svg>
