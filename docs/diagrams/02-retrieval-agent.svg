<svg xmlns="http://www.w3.org/2000/svg" width="1550" height="2190" viewBox="0 0 1550 2190" aria-label="02 · 检索 Agent：查询、证据核对与停止"><defs><marker id="02gentsvg-normal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#527894"/></marker><marker id="02gentsvg-return" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#39775f"/></marker><marker id="02gentsvg-retry" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#a77a31"/></marker><marker id="02gentsvg-stop" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#b05847"/></marker><style>text{font-family:"Microsoft YaHei","PingFang SC",sans-serif;fill:#223b50}.body{font-size:20px}.title{font-size:23px;font-weight:700}.lineLabel{font-size:18px}.node:hover{filter:brightness(.97);cursor:pointer}.node:focus{outline:none}.node:focus rect,.node.selected rect{stroke-width:4}</style></defs><rect width="1550" height="2190" fill="#f8fafc"/><text x="40" y="48" style="font-size:32px;font-weight:700">02 · 检索 Agent：查询、证据核对与停止</text><text x="40" y="84" style="font-size:19px;fill:#617789">当前实现 · 2026-10-04 · 主助手委派式协作 · 点击节点查看说明</text><rect x="40" y="115" width="380" height="1965" rx="17" fill="#ffffff" stroke="#dde5ed"/><rect x="40" y="115" width="380" height="72" rx="17" fill="#e0eaf6"/><text x="230" y="145" text-anchor="middle" class="title">主助手与停止出口</text><text x="230" y="173" text-anchor="middle" style="font-size:16px;fill:#647a8e">委派问题 · 接收实际结论</text><rect x="510" y="115" width="580" height="1965" rx="17" fill="#ffffff" stroke="#dde5ed"/><rect x="510" y="115" width="580" height="72" rx="17" fill="#dff0e7"/><text x="800" y="145" text-anchor="middle" class="title">检索 Agent 独立上下文</text><text x="800" y="173" text-anchor="middle" style="font-size:16px;fill:#647a8e">模型规划 · 查询观察 · 原文校验</text><rect x="1160" y="115" width="365" height="1965" rx="17" fill="#ffffff" stroke="#dde5ed"/><rect x="1160" y="115" width="365" height="72" rx="17" fill="#edf1f5"/><text x="1342.5" y="145" text-anchor="middle" class="title">知识库工具</text><text x="1342.5" y="173" text-anchor="middle" style="font-size:16px;fill:#647a8e">只读 MCP · 资料与向量存于轻量服务</text><path d="M400 283 L530 283" fill="none" stroke="#527894" stroke-width="2.6" stroke-linejoin="round"  marker-end="url(#02gentsvg-normal)"/><text x="443" y="268" class="lineLabel" style="fill:#527894;paint-order:stroke;stroke:#f8fafc;stroke-width:6px;stroke-linejoin:round">委派</text><path d="M800 345 L800 425" fill="none" stroke="#527894" stroke-width="2.6" stroke-linejoin="round"  marker-end="url(#02gentsvg-normal)"/><path d="M530 290 L440 290 L440 485 L400 485" fill="none" stroke="#b05847" stroke-width="2.6" stroke-linejoin="round"  marker-end="url(#02gentsvg-stop)"/><text x="445" y="399" class="lineLabel" style="fill:#b05847;paint-order:stroke;stroke:#f8fafc;stroke-width:6px;stroke-linejoin:round">失败</text><path d="M800 550 L800 620" fill="none" stroke="#527894" stroke-width="2.6" stroke-linejoin="round"  marker-end="url(#02gentsvg-normal)"/><path d="M620 677 L400 717" fill="none" stroke="#b05847" stroke-width="2.6" stroke-linejoin="round"  marker-end="url(#02gentsvg-stop)"/><text x="466" y="676" class="lineLabel" style="fill:#b05847;paint-order:stroke;stroke:#f8fafc;stroke-width:6px;stroke-linejoin:round">无</text><path d="M800 735 L800 820" fill="none" stroke="#527894" stroke-width="2.6" stroke-linejoin="round"  marker-end="url(#02gentsvg-normal)"/><text x="816" y="775" class="lineLabel" style="fill:#527894;paint-order:stroke;stroke:#f8fafc;stroke-width:6px;stroke-linejoin:round">有</text><path d="M1070 885 L1120 885 L1120 1030 L1180 1030" fill="none" stroke="#527894" stroke-width="2.6" stroke-linejoin="round"  marker-end="url(#02gentsvg-normal)"/><text x="1115" y="935" class="lineLabel" style="fill:#527894;paint-order:stroke;stroke:#f8fafc;stroke-width:6px;stroke-linejoin:round">工具请求</text><path d="M1180 1100 L1070 1100" fill="none" stroke="#39775f" stroke-width="2.6" stroke-linejoin="round"  marker-end="url(#02gentsvg-return)"/><text x="1090" y="1080" class="lineLabel" style="fill:#39775f;paint-order:stroke;stroke:#f8fafc;stroke-width:6px;stroke-linejoin:round">真实分块</text><path d="M800 1145 L800 1230" fill="none" stroke="#527894" stroke-width="2.6" stroke-linejoin="round"  marker-end="url(#02gentsvg-normal)"/><path d="M600 1293 L400 1305" fill="none" stroke="#a77a31" stroke-width="2.6" stroke-linejoin="round" stroke-dasharray="8 5" marker-end="url(#02gentsvg-retry)"/><text x="472" y="1278" class="lineLabel" style="fill:#a77a31;paint-order:stroke;stroke:#f8fafc;stroke-width:6px;stroke-linejoin:round">不足</text><path d="M400 1280 L465 1280 L465 882 L530 882" fill="none" stroke="#a77a31" stroke-width="2.6" stroke-linejoin="round" stroke-dasharray="8 5" marker-end="url(#02gentsvg-retry)"/><text x="408" y="1005" class="lineLabel" style="fill:#a77a31;paint-order:stroke;stroke:#f8fafc;stroke-width:6px;stroke-linejoin:round">改写 / 补查</text><path d="M230 1385 L230 1485" fill="none" stroke="#b05847" stroke-width="2.6" stroke-linejoin="round"  marker-end="url(#02gentsvg-stop)"/><text x="245" y="1448" class="lineLabel" style="fill:#b05847;paint-order:stroke;stroke:#f8fafc;stroke-width:6px;stroke-linejoin:round">预算耗尽</text><path d="M800 1355 L800 1485" fill="none" stroke="#527894" stroke-width="2.6" stroke-linejoin="round"  marker-end="url(#02gentsvg-normal)"/><text x="812" y="1425" class="lineLabel" style="fill:#527894;paint-order:stroke;stroke:#f8fafc;stroke-width:6px;stroke-linejoin:round">覆盖要求 / 主动结束</text><path d="M800 1615 L800 1700" fill="none" stroke="#527894" stroke-width="2.6" stroke-linejoin="round"  marker-end="url(#02gentsvg-normal)"/><path d="M590 1765 L400 1770" fill="none" stroke="#a77a31" stroke-width="2.6" stroke-linejoin="round" stroke-dasharray="8 5" marker-end="url(#02gentsvg-retry)"/><text x="466" y="1742" class="lineLabel" style="fill:#a77a31;paint-order:stroke;stroke:#f8fafc;stroke-width:6px;stroke-linejoin:round">无效</text><path d="M400 1740 L475 1740 L475 1550 L530 1550" fill="none" stroke="#a77a31" stroke-width="2.6" stroke-linejoin="round" stroke-dasharray="8 5" marker-end="url(#02gentsvg-retry)"/><text x="565" y="1657" class="lineLabel" style="fill:#a77a31;paint-order:stroke;stroke:#f8fafc;stroke-width:6px;stroke-linejoin:round">纠正后再输出</text><path d="M800 1830 L800 1925" fill="none" stroke="#39775f" stroke-width="2.6" stroke-linejoin="round"  marker-end="url(#02gentsvg-return)"/><text x="816" y="1878" class="lineLabel" style="fill:#39775f;paint-order:stroke;stroke:#f8fafc;stroke-width:6px;stroke-linejoin:round">有效</text><path d="M530 2010 L400 2010" fill="none" stroke="#39775f" stroke-width="2.6" stroke-linejoin="round"  marker-end="url(#02gentsvg-return)"/><text x="447" y="1995" class="lineLabel" style="fill:#39775f;paint-order:stroke;stroke:#f8fafc;stroke-width:6px;stroke-linejoin:round">结果</text><path d="M60 488 L35 488 L35 2000 L60 2000" fill="none" stroke="#b05847" stroke-width="2.6" stroke-linejoin="round"  marker-end="url(#02gentsvg-stop)"/><text x="47" y="1898" class="lineLabel" style="fill:#b05847;paint-order:stroke;stroke:#f8fafc;stroke-width:6px;stroke-linejoin:round">失败结果</text><path d="M60 718 L45 718 L45 2030 L60 2030" fill="none" stroke="#b05847" stroke-width="2.6" stroke-linejoin="round"  marker-end="url(#02gentsvg-stop)"/><text x="47" y="1870" class="lineLabel" style="fill:#b05847;paint-order:stroke;stroke:#f8fafc;stroke-width:6px;stroke-linejoin:round">不足结果</text><path d="M230 1630 L430 1630 L430 1900 L230 1900 L230 1930" fill="none" stroke="#b05847" stroke-width="2.6" stroke-linejoin="round"  marker-end="url(#02gentsvg-stop)"/><text x="245" y="1890" class="lineLabel" style="fill:#b05847;paint-order:stroke;stroke:#f8fafc;stroke-width:6px;stroke-linejoin:round">不足 / 纠正耗尽</text><path d="M230 1855 L230 1930" fill="none" stroke="#b05847" stroke-width="2.6" stroke-linejoin="round"  marker-end="url(#02gentsvg-stop)"/><g class="node" data-node="rinput" role="button" tabindex="0"><title>主助手提交检索任务；question：完整检索问题；context：必要业务背景；acceptance：证据充分的条件</title><rect x="60" y="220" width="340" height="140" rx="14" fill="#e7f0fa" stroke="#719dc7" stroke-width="1.8"/><rect x="60" y="234" width="5" height="112" rx="2" fill="#205984"/><text x="80" y="255" class="title">主助手提交检索任务</text><text x="80" y="286" class="body">question：完整检索问题</text><text x="80" y="313" class="body">context：必要业务背景</text><text x="80" y="340" class="body">acceptance：证据充分的条件</text></g><g class="node" data-node="rauth" role="button" tabindex="0"><title>检查当前用户授权；仅本用户获准的知识库 MCP 连接；没有授权或工具不可用：failed</title><rect x="530" y="220" width="540" height="125" rx="14" fill="#e7f4ee" stroke="#79ad97" stroke-width="1.8"/><rect x="530" y="234" width="5" height="97" rx="2" fill="#25694e"/><text x="550" y="255" class="title">检查当前用户授权</text><text x="550" y="286" class="body">仅本用户获准的知识库 MCP 连接</text><text x="550" y="313" class="body">没有授权或工具不可用：failed</text></g><g class="node" data-node="rpreflight" role="button" tabindex="0"><title>初始列文档也计入 8 次工具调用预算。没有可用索引时返回证据不足，不使用 Jira 作为后备检索。</title><rect x="530" y="425" width="540" height="125" rx="14" fill="#e7f4ee" stroke="#79ad97" stroke-width="1.8"/><rect x="530" y="439" width="5" height="97" rx="2" fill="#25694e"/><text x="550" y="460" class="title">文档和向量索引预检</text><text x="550" y="491" class="body">list_knowledge_documents</text><text x="550" y="518" class="body">检查可检索文档与有效向量索引</text></g><g class="node" data-node="rindex" role="button" tabindex="0"><title>存在可用索引？</title><path d="M800 620L980 677.5L800 735L620 677.5Z" fill="#fff3dc" stroke="#d1af69" stroke-width="2"/><text x="800" y="684.5" text-anchor="middle" class="title">存在可用索引？</text></g><g class="node" data-node="rfail" role="button" tabindex="0"><title>连接或授权失败；status=failed；说明实际原因</title><rect x="60" y="425" width="340" height="125" rx="14" fill="#fff0ed" stroke="#ca8c80" stroke-width="1.8"/><rect x="60" y="439" width="5" height="97" rx="2" fill="#a24838"/><text x="80" y="460" class="title">连接或授权失败</text><text x="80" y="491" class="body">status=failed</text><text x="80" y="518" class="body">说明实际原因</text></g><g class="node" data-node="rnoindex" role="button" tabindex="0"><title>没有可用索引；insufficient_evidence；列出资料或索引缺口</title><rect x="60" y="655" width="340" height="125" rx="14" fill="#fff0ed" stroke="#ca8c80" stroke-width="1.8"/><rect x="60" y="669" width="5" height="97" rx="2" fill="#a24838"/><text x="80" y="690" class="title">没有可用索引</text><text x="80" y="721" class="body">insufficient_evidence</text><text x="80" y="748" class="body">列出资料或索引缺口</text></g><g class="node" data-node="rdecide" role="button" tabindex="0"><title>模型决定下一步；根据问题和已有证据选择工具；列文档、向量搜索或读取原文；围绕单位、条件、冲突进行核对</title><rect x="530" y="820" width="540" height="130" rx="14" fill="#e7f4ee" stroke="#79ad97" stroke-width="1.8"/><rect x="530" y="834" width="5" height="102" rx="2" fill="#25694e"/><text x="550" y="855" class="title">模型决定下一步</text><text x="550" y="886" class="body">根据问题和已有证据选择工具</text><text x="550" y="913" class="body">列文档、向量搜索或读取原文</text><text x="550" y="940" class="body">围绕单位、条件、冲突进行核对</text></g><g class="node" data-node="rtools" role="button" tabindex="0"><title>知识库 MCP 工具；search_knowledge；read_knowledge_chunks；list_knowledge_documents；原文与分块 ID 返回 Agent</title><rect x="1180" y="985" width="325" height="165" rx="14" fill="#f1f4f7" stroke="#a3b3c3" stroke-width="1.8"/><rect x="1180" y="999" width="5" height="137" rx="2" fill="#526c82"/><text x="1200" y="1020" class="title">知识库 MCP 工具</text><text x="1200" y="1051" class="body">search_knowledge</text><text x="1200" y="1078" class="body">read_knowledge_chunks</text><text x="1200" y="1105" class="body">list_knowledge_documents</text><text x="1200" y="1132" class="body">原文与分块 ID 返回 Agent</text></g><g class="node" data-node="robserve" role="button" tabindex="0"><title>观察与保留真实证据；实际原文、chunk_id、文件名、页码；记录查询、调用次数和结果；资料内容不能授权执行动作</title><rect x="530" y="1015" width="540" height="130" rx="14" fill="#e7f4ee" stroke="#79ad97" stroke-width="1.8"/><rect x="530" y="1029" width="5" height="102" rx="2" fill="#25694e"/><text x="550" y="1050" class="title">观察与保留真实证据</text><text x="550" y="1081" class="body">实际原文、chunk_id、文件名、页码</text><text x="550" y="1108" class="body">记录查询、调用次数和结果</text><text x="550" y="1135" class="body">资料内容不能授权执行动作</text></g><g class="node" data-node="rcoverage" role="button" tabindex="0"><title>证据是否覆盖要求？</title><path d="M800 1230L1000 1292.5L800 1355L600 1292.5Z" fill="#fff3dc" stroke="#d1af69" stroke-width="2"/><text x="800" y="1299.5" text-anchor="middle" class="title">证据是否覆盖要求？</text></g><g class="node" data-node="rbudget" role="button" tabindex="0"><title>三个调用上限和时间限制同时约束；改写查询和格式修正都不能重置预算。</title><rect x="60" y="1225" width="340" height="160" rx="14" fill="#fff3dc" stroke="#d1af69" stroke-width="1.8"/><rect x="60" y="1239" width="5" height="132" rx="2" fill="#896222"/><text x="80" y="1260" class="title">还能继续补查？</text><text x="80" y="1291" class="body">最多 6 轮模型请求</text><text x="80" y="1318" class="body">最多 3 次搜索 / 8 次工具</text><text x="80" y="1345" class="body">单任务 120 秒</text><text x="80" y="1372" class="body">抑制重复查询</text></g><g class="node" data-node="rinsufficient" role="button" tabindex="0"><title>停止检索，说明缺口；insufficient_evidence；停止原因 / 缺失信息；不伪造原文或充分结论</title><rect x="60" y="1485" width="340" height="145" rx="14" fill="#fff0ed" stroke="#ca8c80" stroke-width="1.8"/><rect x="60" y="1499" width="5" height="117" rx="2" fill="#a24838"/><text x="80" y="1520" class="title">停止检索，说明缺口</text><text x="80" y="1551" class="body">insufficient_evidence</text><text x="80" y="1578" class="body">停止原因 / 缺失信息</text><text x="80" y="1605" class="body">不伪造原文或充分结论</text></g><g class="node" data-node="rfinal" role="button" tabindex="0"><title>模型输出结构化结论；充分或证据不足的判断；摘要、引用、缺口、停止原因；按实际原文形成引用</title><rect x="530" y="1485" width="540" height="130" rx="14" fill="#e7f4ee" stroke="#79ad97" stroke-width="1.8"/><rect x="530" y="1499" width="5" height="102" rx="2" fill="#25694e"/><text x="550" y="1520" class="title">模型输出结构化结论</text><text x="550" y="1551" class="body">充分或证据不足的判断</text><text x="550" y="1578" class="body">摘要、引用、缺口、停止原因</text><text x="550" y="1605" class="body">按实际原文形成引用</text></g><g class="node" data-node="rvalid" role="button" tabindex="0"><title>格式与引用有效？</title><path d="M800 1700L1010 1765L800 1830L590 1765Z" fill="#fff3dc" stroke="#d1af69" stroke-width="2"/><text x="800" y="1772" text-anchor="middle" class="title">格式与引用有效？</text></g><g class="node" data-node="rcorrect" role="button" tabindex="0"><title>纠正最终输出；反馈真实分块与校验问题；最多纠正 2 次；仍计入 6 轮模型总预算；不能纠正：如实返回不足</title><rect x="60" y="1695" width="340" height="160" rx="14" fill="#fff3dc" stroke="#d1af69" stroke-width="1.8"/><rect x="60" y="1709" width="5" height="132" rx="2" fill="#896222"/><text x="80" y="1730" class="title">纠正最终输出</text><text x="80" y="1761" class="body">反馈真实分块与校验问题</text><text x="80" y="1788" class="body">最多纠正 2 次</text><text x="80" y="1815" class="body">仍计入 6 轮模型总预算</text><text x="80" y="1842" class="body">不能纠正：如实返回不足</text></g><g class="node" data-node="rcontract" role="button" tabindex="0"><title>引用的 chunk_id 必须来自实际工具返回；quote 必须是对应原文中的非空子串。Markdown 不编造 PDF 页码。</title><rect x="530" y="1925" width="540" height="155" rx="14" fill="#e7f5ed" stroke="#70aa86" stroke-width="1.8"/><rect x="530" y="1939" width="5" height="127" rx="2" fill="#2c7448"/><text x="550" y="1960" class="title">返回实际检索结果</text><text x="550" y="1991" class="body">status / summary / evidence</text><text x="550" y="2018" class="body">stop_reason / attempts</text><text x="550" y="2045" class="body">tool_evidence / missing_information</text><text x="550" y="2072" class="body">充分结论需要有效引用和足够覆盖</text></g><g class="node" data-node="rconsumer" role="button" tabindex="0"><title>主助手继续或停止；充分：回答或交接编码；不足 / 失败：报告缺口；当轮关闭检索、编码委派</title><rect x="60" y="1930" width="340" height="150" rx="14" fill="#e7f0fa" stroke="#719dc7" stroke-width="1.8"/><rect x="60" y="1944" width="5" height="122" rx="2" fill="#205984"/><text x="80" y="1965" class="title">主助手继续或停止</text><text x="80" y="1996" class="body">充分：回答或交接编码</text><text x="80" y="2023" class="body">不足 / 失败：报告缺口</text><text x="80" y="2050" class="body">当轮关闭检索、编码委派</text></g><text x="40" y="2122" style="font-size:18px;fill:#60778a">充分性是当前资料与预算下的判断；检索相似度和模型结论不是科学结论认证。</text><text x="40" y="2149" style="font-size:18px;fill:#60778a">检索 Agent 只读知识库；没有终端、Jira 写入、上传删除或配置管理工具。</text></svg>
