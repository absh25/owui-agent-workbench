<svg xmlns="http://www.w3.org/2000/svg" width="1990" height="1900" viewBox="0 0 1990 1900" aria-label="01 · 当前多 Agent 协作总流程"><defs><marker id="01gentsvg-normal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#527894"/></marker><marker id="01gentsvg-return" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#39775f"/></marker><marker id="01gentsvg-retry" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#a77a31"/></marker><marker id="01gentsvg-stop" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#b05847"/></marker><style>text{font-family:"Microsoft YaHei","PingFang SC",sans-serif;fill:#223b50}.body{font-size:20px}.title{font-size:23px;font-weight:700}.lineLabel{font-size:18px}.node:hover{filter:brightness(.97);cursor:pointer}.node:focus{outline:none}.node:focus rect,.node.selected rect{stroke-width:4}</style></defs><rect width="1990" height="1900" fill="#f8fafc"/><text x="40" y="48" style="font-size:32px;font-weight:700">01 · 当前多 Agent 协作总流程</text><text x="40" y="84" style="font-size:19px;fill:#617789">当前实现 · 2026-10-04 · 主助手委派式协作 · 点击节点查看说明</text><rect x="40" y="115" width="320" height="1675" rx="17" fill="#ffffff" stroke="#dde5ed"/><rect x="40" y="115" width="320" height="72" rx="17" fill="#e8eef5"/><text x="200" y="145" text-anchor="middle" class="title">用户与 OWUI</text><text x="200" y="173" text-anchor="middle" style="font-size:16px;fill:#647a8e">身份、权限、对话与展示</text><rect x="390" y="115" width="345" height="1675" rx="17" fill="#ffffff" stroke="#dde5ed"/><rect x="390" y="115" width="345" height="72" rx="17" fill="#dceaf8"/><text x="562.5" y="145" text-anchor="middle" class="title">主助手</text><text x="562.5" y="173" text-anchor="middle" style="font-size:16px;fill:#647a8e">原生工具循环 · 全局任务目标</text><rect x="760" y="115" width="370" height="1675" rx="17" fill="#ffffff" stroke="#dde5ed"/><rect x="760" y="115" width="370" height="72" rx="17" fill="#dff0e7"/><text x="945" y="145" text-anchor="middle" class="title">检索 Agent</text><text x="945" y="173" text-anchor="middle" style="font-size:16px;fill:#647a8e">独立上下文 · 只读知识库</text><rect x="1160" y="115" width="375" height="1675" rx="17" fill="#ffffff" stroke="#dde5ed"/><rect x="1160" y="115" width="375" height="72" rx="17" fill="#e3e7f7"/><text x="1347.5" y="145" text-anchor="middle" class="title">编码 Agent</text><text x="1347.5" y="173" text-anchor="middle" style="font-size:16px;fill:#647a8e">独立 SDK 会话 · 获准终端</text><rect x="1560" y="115" width="385" height="1675" rx="17" fill="#ffffff" stroke="#dde5ed"/><rect x="1560" y="115" width="385" height="72" rx="17" fill="#fff0d3"/><text x="1752.5" y="145" text-anchor="middle" class="title">验收与交付</text><text x="1752.5" y="173" text-anchor="middle" style="font-size:16px;fill:#647a8e">程序模块与视觉检查</text><path d="M200 330 L200 420" fill="none" stroke="#527894" stroke-width="2.6" stroke-linejoin="round"  marker-end="url(#01gentsvg-normal)"/><path d="M340 487 L410 487" fill="none" stroke="#527894" stroke-width="2.6" stroke-linejoin="round"  marker-end="url(#01gentsvg-normal)"/><path d="M710 480 L780 480" fill="none" stroke="#527894" stroke-width="2.6" stroke-linejoin="round"  marker-end="url(#01gentsvg-normal)"/><text x="720" y="460" class="lineLabel" style="fill:#527894;paint-order:stroke;stroke:#f8fafc;stroke-width:6px;stroke-linejoin:round">检索</text><path d="M945 535 L945 610" fill="none" stroke="#527894" stroke-width="2.6" stroke-linejoin="round"  marker-end="url(#01gentsvg-normal)"/><path d="M925 775 L925 835" fill="none" stroke="#527894" stroke-width="2.6" stroke-linejoin="round"  marker-end="url(#01gentsvg-normal)"/><path d="M1020 835 L1020 775" fill="none" stroke="#39775f" stroke-width="2.6" stroke-linejoin="round"  marker-end="url(#01gentsvg-return)"/><text x="1028" y="812" class="lineLabel" style="fill:#39775f;paint-order:stroke;stroke:#f8fafc;stroke-width:6px;stroke-linejoin:round">原文观察</text><path d="M945 970 L945 1030" fill="none" stroke="#527894" stroke-width="2.6" stroke-linejoin="round"  marker-end="url(#01gentsvg-normal)"/><path d="M780 1105 L710 1105" fill="none" stroke="#39775f" stroke-width="2.6" stroke-linejoin="round"  marker-end="url(#01gentsvg-return)"/><text x="716" y="1083" class="lineLabel" style="fill:#39775f;paint-order:stroke;stroke:#f8fafc;stroke-width:6px;stroke-linejoin:round">结果</text><path d="M560 1180 L560 1245 L1145 1245 L1145 770 L1180 770" fill="none" stroke="#527894" stroke-width="2.6" stroke-linejoin="round"  marker-end="url(#01gentsvg-normal)"/><text x="770" y="1230" class="lineLabel" style="fill:#527894;paint-order:stroke;stroke:#f8fafc;stroke-width:6px;stroke-linejoin:round">证据充分且需要编码</text><path d="M560 555 L560 700" fill="none" stroke="#527894" stroke-width="2.6" stroke-linejoin="round"  marker-end="url(#01gentsvg-normal)"/><text x="576" y="642" class="lineLabel" style="fill:#527894;paint-order:stroke;stroke:#f8fafc;stroke-width:6px;stroke-linejoin:round">按需分支</text><path d="M710 790 L1180 790" fill="none" stroke="#527894" stroke-width="2.6" stroke-linejoin="round"  marker-end="url(#01gentsvg-normal)"/><text x="895" y="816" class="lineLabel" style="fill:#527894;paint-order:stroke;stroke:#f8fafc;stroke-width:6px;stroke-linejoin:round">直接编码</text><path d="M1345 845 L1345 925" fill="none" stroke="#527894" stroke-width="2.6" stroke-linejoin="round"  marker-end="url(#01gentsvg-normal)"/><path d="M1345 1085 L1345 1170" fill="none" stroke="#527894" stroke-width="2.6" stroke-linejoin="round"  marker-end="url(#01gentsvg-normal)"/><path d="M1320 1320 L1320 1400" fill="none" stroke="#527894" stroke-width="2.6" stroke-linejoin="round"  marker-end="url(#01gentsvg-normal)"/><path d="M1430 1400 L1430 1320" fill="none" stroke="#39775f" stroke-width="2.6" stroke-linejoin="round"  marker-end="url(#01gentsvg-return)"/><text x="1210" y="1365" class="lineLabel" style="fill:#39775f;paint-order:stroke;stroke:#f8fafc;stroke-width:6px;stroke-linejoin:round">真实工具观察</text><path d="M1515 1230 L1580 1230" fill="none" stroke="#527894" stroke-width="2.6" stroke-linejoin="round"  marker-end="url(#01gentsvg-normal)"/><text x="1518" y="1212" class="lineLabel" style="fill:#527894;paint-order:stroke;stroke:#f8fafc;stroke-width:6px;stroke-linejoin:round">成功</text><path d="M1750 1335 L1750 1420" fill="none" stroke="#a77a31" stroke-width="2.6" stroke-linejoin="round" stroke-dasharray="8 5" marker-end="url(#01gentsvg-retry)"/><text x="1766" y="1390" class="lineLabel" style="fill:#a77a31;paint-order:stroke;stroke:#f8fafc;stroke-width:6px;stroke-linejoin:round">未通过</text><path d="M1580 1487 L1545 1487 L1545 1280 L1515 1280" fill="none" stroke="#a77a31" stroke-width="2.6" stroke-linejoin="round" stroke-dasharray="8 5" marker-end="url(#01gentsvg-retry)"/><text x="1585" y="1590" class="lineLabel" style="fill:#a77a31;paint-order:stroke;stroke:#f8fafc;stroke-width:6px;stroke-linejoin:round">仍有次数：同会话修复</text><path d="M1925 1270 L1950 1270 L1950 1695 L1925 1695" fill="none" stroke="#39775f" stroke-width="2.6" stroke-linejoin="round"  marker-end="url(#01gentsvg-return)"/><text x="1925" y="1580" class="lineLabel" style="fill:#39775f;paint-order:stroke;stroke:#f8fafc;stroke-width:6px;stroke-linejoin:round">通过</text><path d="M1580 1695 L710 1695" fill="none" stroke="#39775f" stroke-width="2.6" stroke-linejoin="round"  marker-end="url(#01gentsvg-return)"/><text x="1010" y="1680" class="lineLabel" style="fill:#39775f;paint-order:stroke;stroke:#f8fafc;stroke-width:6px;stroke-linejoin:round">实际状态与交付结果</text><path d="M560 1180 L560 1660" fill="none" stroke="#39775f" stroke-width="2.6" stroke-linejoin="round"  marker-end="url(#01gentsvg-return)"/><text x="575" y="1590" class="lineLabel" style="fill:#39775f;paint-order:stroke;stroke:#f8fafc;stroke-width:6px;stroke-linejoin:round">仅回答 / 不足 / 失败</text><path d="M1515 1300 L1550 1300 L1550 1600 L730 1600 L730 1730 L710 1730" fill="none" stroke="#b05847" stroke-width="2.6" stroke-linejoin="round"  marker-end="url(#01gentsvg-stop)"/><text x="1170" y="1585" class="lineLabel" style="fill:#b05847;paint-order:stroke;stroke:#f8fafc;stroke-width:6px;stroke-linejoin:round">SDK 失败 / 验收耗尽</text><path d="M410 1730 L340 1730" fill="none" stroke="#39775f" stroke-width="2.6" stroke-linejoin="round"  marker-end="url(#01gentsvg-return)"/><text x="350" y="1715" class="lineLabel" style="fill:#39775f;paint-order:stroke;stroke:#f8fafc;stroke-width:6px;stroke-linejoin:round">呈现</text><path d="M1580 1525 L1550 1525 L1550 1600" fill="none" stroke="#b05847" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#01gentsvg-stop)"/><g class="node" data-node="user" role="button" tabindex="0"><title>入口是 owui-main「协作助手」。主助手按需选择普通问答、检索、编码或业务操作。</title><rect x="60" y="220" width="280" height="110" rx="14" fill="#e7f0fa" stroke="#719dc7" stroke-width="1.8"/><rect x="60" y="234" width="5" height="82" rx="2" fill="#205984"/><text x="80" y="255" class="title">用户发送需求</text><text x="80" y="286" class="body">目标、资料线索、约束</text></g><g class="node" data-node="owui" role="button" tabindex="0"><title>Open WebUI；认证、历史、用户权限；提供本次获准工具；保存对话和实际结果</title><rect x="60" y="420" width="280" height="135" rx="14" fill="#f1f4f7" stroke="#a3b3c3" stroke-width="1.8"/><rect x="60" y="434" width="5" height="107" rx="2" fill="#526c82"/><text x="80" y="455" class="title">Open WebUI</text><text x="80" y="486" class="body">认证、历史、用户权限</text><text x="80" y="513" class="body">提供本次获准工具</text><text x="80" y="540" class="body">保存对话和实际结果</text></g><g class="node" data-node="plan" role="button" tabindex="0"><title>主助手由 OWUI 原生工具循环驱动。Pipe 每次完成一次模型请求；OWUI 执行工具并保存结果后再次请求主模型。主助手不直接获得底层 Terminal 和知识库工具。</title><rect x="410" y="420" width="300" height="135" rx="14" fill="#e7f0fa" stroke="#719dc7" stroke-width="1.8"/><rect x="410" y="434" width="5" height="107" rx="2" fill="#205984"/><text x="430" y="455" class="title">主助手理解与规划</text><text x="430" y="486" class="body">整理目标和任务上下文</text><text x="430" y="513" class="body">普通问答 / 检索 / 编码</text><text x="430" y="540" class="body">按需安排 Jira 业务</text></g><g class="node" data-node="rdelegate" role="button" tabindex="0"><title>完整检索问题、必要上下文和证据要求交给检索 Agent。</title><rect x="780" y="420" width="330" height="115" rx="14" fill="#e7f4ee" stroke="#79ad97" stroke-width="1.8"/><rect x="780" y="434" width="5" height="87" rx="2" fill="#25694e"/><text x="800" y="455" class="title">检索任务委派</text><text x="800" y="486" class="body">delegate_retrieval_task</text><text x="800" y="513" class="body">question / context / acceptance</text></g><g class="node" data-node="rloop" role="button" tabindex="0"><title>独立模型、任务消息历史和工具循环。默认 6 轮模型、3 次搜索、8 次工具、120 秒；只读知识库。详见图 2。</title><rect x="780" y="610" width="330" height="165" rx="14" fill="#e7f4ee" stroke="#79ad97" stroke-width="1.8"/><rect x="780" y="624" width="5" height="137" rx="2" fill="#25694e"/><text x="800" y="645" class="title">检索 Agent 独立循环</text><text x="800" y="676" class="body">知识库授权与文档预检</text><text x="800" y="703" class="body">模型选择搜索或读取原文</text><text x="800" y="730" class="body">观察证据，改写查询补查</text><text x="800" y="757" class="body">核对覆盖度与停止条件</text></g><g class="node" data-node="rtools" role="button" tabindex="0"><title>知识库只读 MCP；列文档 / 向量搜索 / 原文；真实分块与文件名；轻量服务：SQLite＋百炼</title><rect x="780" y="835" width="330" height="135" rx="14" fill="#f1f4f7" stroke="#a3b3c3" stroke-width="1.8"/><rect x="780" y="849" width="5" height="107" rx="2" fill="#526c82"/><text x="800" y="870" class="title">知识库只读 MCP</text><text x="800" y="901" class="body">列文档 / 向量搜索 / 原文</text><text x="800" y="928" class="body">真实分块与文件名</text><text x="800" y="955" class="body">轻量服务：SQLite＋百炼</text></g><g class="node" data-node="rresult" role="button" tabindex="0"><title>返回检索结果；sufficient / 不足 / failed；摘要、原文引用、缺口；尝试记录与停止原因</title><rect x="780" y="1030" width="330" height="150" rx="14" fill="#e7f4ee" stroke="#79ad97" stroke-width="1.8"/><rect x="780" y="1044" width="5" height="122" rx="2" fill="#25694e"/><text x="800" y="1065" class="title">返回检索结果</text><text x="800" y="1096" class="body">sufficient / 不足 / failed</text><text x="800" y="1123" class="body">摘要、原文引用、缺口</text><text x="800" y="1150" class="body">尝试记录与停止原因</text></g><g class="node" data-node="handoff" role="button" tabindex="0"><title>检索不足或失败时，当前工具映射移除本轮检索和编码委派；下一用户轮重新评估。不会物理关闭所有 Jira 工具。</title><rect x="410" y="1030" width="300" height="150" rx="14" fill="#e7f0fa" stroke="#719dc7" stroke-width="1.8"/><rect x="410" y="1044" width="5" height="122" rx="2" fill="#205984"/><text x="430" y="1065" class="title">主助手消费证据</text><text x="430" y="1096" class="body">充分：回答或交接编码</text><text x="430" y="1123" class="body">不足 / 失败：说明缺口</text><text x="430" y="1150" class="body">当轮关闭检索、编码委派</text></g><g class="node" data-node="direct" role="button" tabindex="0"><title>不依赖资料的任务；直接委派编码；或直接回答；业务按实际用户目标执行；Jira 确认见图 5</title><rect x="410" y="700" width="300" height="125" rx="14" fill="#e7f0fa" stroke="#719dc7" stroke-width="1.8"/><rect x="410" y="714" width="5" height="97" rx="2" fill="#205984"/><text x="430" y="735" class="title">不依赖资料的任务</text><text x="430" y="766" class="body">直接委派编码；或直接回答</text><text x="430" y="793" class="body">业务按实际用户目标执行</text><text x="430" y="820" class="body">Jira 确认见图 5</text></g><g class="node" data-node="cdecl" role="button" tabindex="0"><title>依赖资料的编码任务携带核实后的规则、引用和适用条件。专业 Agent 之间不直接调用。</title><rect x="1180" y="700" width="335" height="145" rx="14" fill="#eceefa" stroke="#929fce" stroke-width="1.8"/><rect x="1180" y="714" width="5" height="117" rx="2" fill="#465e9c"/><text x="1200" y="735" class="title">编码任务委派</text><text x="1200" y="766" class="body">delegate_coding_task</text><text x="1200" y="793" class="body">task / repo / context</text><text x="1200" y="820" class="body">acceptance / 验收参数</text></g><g class="node" data-node="cprep" role="button" tabindex="0"><title>编码前置检查；参数校验；可纠正 2 次；用户授权与项目路径；进程内工作区锁与快照；固定本次验收命令</title><rect x="1180" y="925" width="335" height="160" rx="14" fill="#eceefa" stroke="#929fce" stroke-width="1.8"/><rect x="1180" y="939" width="5" height="132" rx="2" fill="#465e9c"/><text x="1200" y="960" class="title">编码前置检查</text><text x="1200" y="991" class="body">参数校验；可纠正 2 次</text><text x="1200" y="1018" class="body">用户授权与项目路径</text><text x="1200" y="1045" class="body">进程内工作区锁与快照</text><text x="1200" y="1072" class="body">固定本次验收命令</text></g><g class="node" data-node="cloop" role="button" tabindex="0"><title>SDK 是框架，当前编码模型是 qwen3.7-plus。正常成功后进入独立验收；SDK 异常或超时直接失败。详见图 3。</title><rect x="1180" y="1170" width="335" height="150" rx="14" fill="#eceefa" stroke="#929fce" stroke-width="1.8"/><rect x="1180" y="1184" width="5" height="122" rx="2" fill="#465e9c"/><text x="1200" y="1205" class="title">编码 Agent 独立会话</text><text x="1200" y="1236" class="body">Claude Agent SDK 执行循环</text><text x="1200" y="1263" class="body">读写文件、运行、调试</text><text x="1200" y="1290" class="body">仅本任务获准终端工具</text></g><g class="node" data-node="terminal" role="button" tabindex="0"><title>当前用户授权和写路径检查不等于任意 shell 的完全隔离沙箱。</title><rect x="1180" y="1400" width="335" height="130" rx="14" fill="#f1f4f7" stroke="#a3b3c3" stroke-width="1.8"/><rect x="1180" y="1414" width="5" height="102" rx="2" fill="#526c82"/><text x="1200" y="1435" class="title">OpenTerminal</text><text x="1200" y="1466" class="body">真实文件与进程执行</text><text x="1200" y="1493" class="body">工具结果返回编码会话</text><text x="1200" y="1520" class="body">命令固定在项目 cwd</text></g><g class="node" data-node="verify" role="button" tabindex="0"><title>视觉复核没有自主工具循环，属于模块而非第四个完整 Agent。前端任务可能同时需要测试和截图。详见图 4。</title><rect x="1580" y="1170" width="345" height="165" rx="14" fill="#fff3dc" stroke="#d1af69" stroke-width="1.8"/><rect x="1580" y="1184" width="5" height="137" rx="2" fill="#896222"/><text x="1600" y="1205" class="title">独立验收模块</text><text x="1600" y="1236" class="body">真实测试 / 构建</text><text x="1600" y="1263" class="body">桌面与手机浏览器截图</text><text x="1600" y="1290" class="body">独立视觉复核</text><text x="1600" y="1317" class="body">文件 SHA 与快照一致性</text></g><g class="node" data-node="repair" role="button" tabindex="0"><title>参数纠正和验收修复独立计数。SDK 异常或超时不进入验收修复循环。</title><rect x="1580" y="1420" width="345" height="135" rx="14" fill="#fff3dc" stroke="#d1af69" stroke-width="1.8"/><rect x="1580" y="1434" width="5" height="107" rx="2" fill="#896222"/><text x="1600" y="1455" class="title">不通过：反馈与修复</text><text x="1600" y="1486" class="body">错误＋截图 → 原 SDK 会话</text><text x="1600" y="1513" class="body">默认最多修复 2 次</text><text x="1600" y="1540" class="body">耗尽：报告未完成</text></g><g class="node" data-node="deliver" role="button" tabindex="0"><title>验收完成和附件交付完成是两个状态。附件失败当前不会把 completed 改成 failed，也不会自动触发修复。</title><rect x="1580" y="1625" width="345" height="165" rx="14" fill="#e7f5ed" stroke="#70aa86" stroke-width="1.8"/><rect x="1580" y="1639" width="5" height="137" rx="2" fill="#2c7448"/><text x="1600" y="1660" class="title">通过后尝试交付</text><text x="1600" y="1691" class="body">completed＋验收记录</text><text x="1600" y="1718" class="body">本地 HTML/SVG 原件附件</text><text x="1600" y="1745" class="body">核对 SHA，提供预览</text><text x="1600" y="1772" class="body">附件失败：delivery_errors</text></g><g class="node" data-node="summary" role="button" tabindex="0"><title>主助手按实际结果汇报；引用、改动、测试与附件；失败或缺口明确说明；附件未完成如实说明</title><rect x="410" y="1660" width="300" height="135" rx="14" fill="#e7f0fa" stroke="#719dc7" stroke-width="1.8"/><rect x="410" y="1674" width="5" height="107" rx="2" fill="#205984"/><text x="430" y="1695" class="title">主助手按实际结果汇报</text><text x="430" y="1726" class="body">引用、改动、测试与附件</text><text x="430" y="1753" class="body">失败或缺口明确说明</text><text x="430" y="1780" class="body">附件未完成如实说明</text></g><g class="node" data-node="out" role="button" tabindex="0"><title>用户查看结果；工作区程序与真实测试；HTML/SVG 原件与预览；必要时补资料再发起任务</title><rect x="60" y="1660" width="280" height="135" rx="14" fill="#e7f5ed" stroke="#70aa86" stroke-width="1.8"/><rect x="60" y="1674" width="5" height="107" rx="2" fill="#2c7448"/><text x="80" y="1695" class="title">用户查看结果</text><text x="80" y="1726" class="body">工作区程序与真实测试</text><text x="80" y="1753" class="body">HTML/SVG 原件与预览</text><text x="80" y="1780" class="body">必要时补资料再发起任务</text></g><text x="40" y="1832" style="font-size:18px;fill:#60778a">协作交接经过主助手；普通问答、直接编码和 Jira 不要求先检索。各专业循环和预算见后续详图。</text><text x="40" y="1859" style="font-size:18px;fill:#60778a">绿色箭头：实际结果返回；金色虚线：有限修复反馈；红色箭头：失败出口。</text></svg>
