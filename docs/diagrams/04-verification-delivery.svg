<svg xmlns="http://www.w3.org/2000/svg" width="1590" height="2700" viewBox="0 0 1590 2700" aria-label="04 · 独立验收、同会话修复与附件交付"><defs><marker id="04svg-normal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#527894"/></marker><marker id="04svg-return" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#39775f"/></marker><marker id="04svg-retry" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#a77a31"/></marker><marker id="04svg-stop" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#b05847"/></marker><style>text{font-family:"Microsoft YaHei","PingFang SC",sans-serif;fill:#223b50}.body{font-size:20px}.title{font-size:23px;font-weight:700}.lineLabel{font-size:18px}.node:hover{filter:brightness(.97);cursor:pointer}.node:focus{outline:none}.node:focus rect,.node.selected rect{stroke-width:4}</style></defs><rect width="1590" height="2700" fill="#f8fafc"/><text x="40" y="48" style="font-size:32px;font-weight:700">04 · 独立验收、同会话修复与附件交付</text><text x="40" y="84" style="font-size:19px;fill:#617789">当前实现 · 2026-10-04 · 主助手委派式协作 · 点击节点查看说明</text><rect x="40" y="115" width="380" height="2475" rx="17" fill="#ffffff" stroke="#dde5ed"/><rect x="40" y="115" width="380" height="72" rx="17" fill="#e4e8f7"/><text x="230" y="145" text-anchor="middle" class="title">同会话修复与停止</text><text x="230" y="173" text-anchor="middle" style="font-size:16px;fill:#647a8e">独立修复预算 · 固定原验收标准</text><rect x="510" y="115" width="580" height="2475" rx="17" fill="#ffffff" stroke="#dde5ed"/><rect x="510" y="115" width="580" height="72" rx="17" fill="#fff0d3"/><text x="800" y="145" text-anchor="middle" class="title">独立验收与完成判定</text><text x="800" y="173" text-anchor="middle" style="font-size:16px;fill:#647a8e">真实执行证据 · 文件一致性</text><rect x="1170" y="115" width="400" height="2475" rx="17" fill="#ffffff" stroke="#dde5ed"/><rect x="1170" y="115" width="400" height="72" rx="17" fill="#eef2f6"/><text x="1370" y="145" text-anchor="middle" class="title">浏览器、视觉与交付</text><text x="1370" y="173" text-anchor="middle" style="font-size:16px;fill:#647a8e">执行模块 · 并非新增自主 Agent</text><path d="M800 335 L800 415" fill="none" stroke="#527894" stroke-width="2.6" stroke-linejoin="round"  marker-end="url(#04svg-normal)"/><path d="M800 580 L800 675" fill="none" stroke="#527894" stroke-width="2.6" stroke-linejoin="round"  marker-end="url(#04svg-normal)"/><path d="M800 840 L800 935" fill="none" stroke="#527894" stroke-width="2.6" stroke-linejoin="round"  marker-end="url(#04svg-normal)"/><path d="M990 992 L1130 992 L1130 902 L1190 902" fill="none" stroke="#527894" stroke-width="2.6" stroke-linejoin="round"  marker-end="url(#04svg-normal)"/><text x="1125" y="970" class="lineLabel" style="fill:#527894;paint-order:stroke;stroke:#f8fafc;stroke-width:6px;stroke-linejoin:round">是</text><path d="M1370 995 L1370 1080" fill="none" stroke="#527894" stroke-width="2.6" stroke-linejoin="round"  marker-end="url(#04svg-normal)"/><path d="M1190 1160 L1130 1160 L1130 1277 L1070 1277" fill="none" stroke="#39775f" stroke-width="2.6" stroke-linejoin="round"  marker-end="url(#04svg-return)"/><text x="1100" y="1240" class="lineLabel" style="fill:#39775f;paint-order:stroke;stroke:#f8fafc;stroke-width:6px;stroke-linejoin:round">视觉结果</text><path d="M800 1050 L800 1210" fill="none" stroke="#527894" stroke-width="2.6" stroke-linejoin="round"  marker-end="url(#04svg-normal)"/><text x="814" y="1150" class="lineLabel" style="fill:#527894;paint-order:stroke;stroke:#f8fafc;stroke-width:6px;stroke-linejoin:round">无 UI：继续检查</text><path d="M800 1345 L800 1450" fill="none" stroke="#527894" stroke-width="2.6" stroke-linejoin="round"  marker-end="url(#04svg-normal)"/><path d="M610 1507 L400 1510" fill="none" stroke="#a77a31" stroke-width="2.6" stroke-linejoin="round" stroke-dasharray="8 5" marker-end="url(#04svg-retry)"/><text x="452" y="1490" class="lineLabel" style="fill:#a77a31;paint-order:stroke;stroke:#f8fafc;stroke-width:6px;stroke-linejoin:round">未通过</text><path d="M230 1605 L230 1690" fill="none" stroke="#a77a31" stroke-width="2.6" stroke-linejoin="round" stroke-dasharray="8 5" marker-end="url(#04svg-retry)"/><text x="247" y="1665" class="lineLabel" style="fill:#a77a31;paint-order:stroke;stroke:#f8fafc;stroke-width:6px;stroke-linejoin:round">尚有次数</text><path d="M230 1830 L230 1925" fill="none" stroke="#527894" stroke-width="2.6" stroke-linejoin="round"  marker-end="url(#04svg-normal)"/><path d="M400 1985 L465 1985 L465 277 L530 277" fill="none" stroke="#a77a31" stroke-width="2.6" stroke-linejoin="round" stroke-dasharray="8 5" marker-end="url(#04svg-retry)"/><text x="410" y="1893" class="lineLabel" style="fill:#a77a31;paint-order:stroke;stroke:#f8fafc;stroke-width:6px;stroke-linejoin:round">修复后重验</text><path d="M60 1540 L30 1540 L30 2250 L60 2250" fill="none" stroke="#b05847" stroke-width="2.6" stroke-linejoin="round"  marker-end="url(#04svg-stop)"/><text x="39" y="2148" class="lineLabel" style="fill:#b05847;paint-order:stroke;stroke:#f8fafc;stroke-width:6px;stroke-linejoin:round">耗尽</text><path d="M800 1565 L800 1710" fill="none" stroke="#39775f" stroke-width="2.6" stroke-linejoin="round"  marker-end="url(#04svg-return)"/><text x="816" y="1640" class="lineLabel" style="fill:#39775f;paint-order:stroke;stroke:#f8fafc;stroke-width:6px;stroke-linejoin:round">通过</text><path d="M800 1845 L800 1935" fill="none" stroke="#527894" stroke-width="2.6" stroke-linejoin="round"  marker-end="url(#04svg-normal)"/><path d="M800 2125 L800 2220" fill="none" stroke="#527894" stroke-width="2.6" stroke-linejoin="round"  marker-end="url(#04svg-normal)"/><path d="M990 2277 L1190 2295" fill="none" stroke="#b05847" stroke-width="2.6" stroke-linejoin="round"  marker-end="url(#04svg-stop)"/><text x="1080" y="2253" class="lineLabel" style="fill:#b05847;paint-order:stroke;stroke:#f8fafc;stroke-width:6px;stroke-linejoin:round">有错误</text><path d="M800 2335 L800 2435" fill="none" stroke="#39775f" stroke-width="2.6" stroke-linejoin="round"  marker-end="url(#04svg-return)"/><text x="816" y="2391" class="lineLabel" style="fill:#39775f;paint-order:stroke;stroke:#f8fafc;stroke-width:6px;stroke-linejoin:round">无错误</text><path d="M1370 2375 L1370 2508 L1070 2508" fill="none" stroke="#39775f" stroke-width="2.6" stroke-linejoin="round"  marker-end="url(#04svg-return)"/><text x="1120" y="2490" class="lineLabel" style="fill:#39775f;paint-order:stroke;stroke:#f8fafc;stroke-width:6px;stroke-linejoin:round">实际交付问题</text><g class="node" data-node="ventry" role="button" tabindex="0"><title>SDK 正常成功后进入验收；解析 Agent 报告，读取实际项目；独立验收不依赖模型口头完成声明</title><rect x="530" y="220" width="540" height="115" rx="14" fill="#fff3dc" stroke="#d1af69" stroke-width="1.8"/><rect x="530" y="234" width="5" height="87" rx="2" fill="#896222"/><text x="550" y="255" class="title">SDK 正常成功后进入验收</text><text x="550" y="286" class="body">解析 Agent 报告，读取实际项目</text><text x="550" y="313" class="body">独立验收不依赖模型口头完成声明</text></g><g class="node" data-node="vfiles" role="button" tabindex="0"><title>检查实际文件与任务约束；比较初始快照，独立计算 changed_files；只读任务不得产生文件修改；未解决 open_issues 不能忽略；要求保留测试时，检查原测试未改</title><rect x="530" y="415" width="540" height="165" rx="14" fill="#fff3dc" stroke="#d1af69" stroke-width="1.8"/><rect x="530" y="429" width="5" height="137" rx="2" fill="#896222"/><text x="550" y="450" class="title">检查实际文件与任务约束</text><text x="550" y="481" class="body">比较初始快照，独立计算 changed_files</text><text x="550" y="508" class="body">只读任务不得产生文件修改</text><text x="550" y="535" class="body">未解决 open_issues 不能忽略</text><text x="550" y="562" class="body">要求保留测试时，检查原测试未改</text></g><g class="node" data-node="vcommands" role="button" tabindex="0"><title>一般代码需要实际测试或构建等检查。明确本地 HTML/SVG 预览且命令为空时，不自动跑工作区里的无关测试。</title><rect x="530" y="675" width="540" height="165" rx="14" fill="#fff3dc" stroke="#d1af69" stroke-width="1.8"/><rect x="530" y="689" width="5" height="137" rx="2" fill="#896222"/><text x="550" y="710" class="title">运行预先固定的验收命令</text><text x="550" y="741" class="body">真实执行并取得进程退出码</text><text x="550" y="768" class="body">退出码非零：未通过</text><text x="550" y="795" class="body">0 tests / no tests ran：未通过</text><text x="550" y="822" class="body">只读、文档、纯绘图按任务选检查</text></g><g class="node" data-node="vui" role="button" tabindex="0"><title>需要网页或图形验收？</title><path d="M800 935L990 992.5L800 1050L610 992.5Z" fill="#fff3dc" stroke="#d1af69" stroke-width="2"/><text x="800" y="999.5" text-anchor="middle" class="title">需要网页或图形验收？</text></g><g class="node" data-node="vrender" role="button" tabindex="0"><title>独立 verification-browser 服务。SVG 作为响应式图片渲染，不直接执行 SVG 文档中的脚本。</title><rect x="1190" y="820" width="360" height="175" rx="14" fill="#f1f4f7" stroke="#a3b3c3" stroke-width="1.8"/><rect x="1190" y="834" width="5" height="147" rx="2" fill="#526c82"/><text x="1210" y="855" class="title">浏览器真实渲染</text><text x="1210" y="886" class="body">检查入口、加载错误、空白、溢出</text><text x="1210" y="913" class="body">桌面 1280×800：两张帧</text><text x="1210" y="940" class="body">手机 390×844：一张帧</text><text x="1210" y="967" class="body">本地文件记录源 SHA256</text></g><g class="node" data-node="vvisual" role="button" tabindex="0"><title>这是一项独立视觉模型检查，不是自主 Agent。截图采样不能保证所有动画帧或主观审美。</title><rect x="1190" y="1080" width="360" height="165" rx="14" fill="#fff3dc" stroke="#d1af69" stroke-width="1.8"/><rect x="1190" y="1094" width="5" height="137" rx="2" fill="#896222"/><text x="1210" y="1115" class="title">独立视觉模型复核</text><text x="1210" y="1146" class="body">输入真实截图、任务与验收要求</text><text x="1210" y="1173" class="body">检查主体、布局、裁切、动作连接</text><text x="1210" y="1200" class="body">模型返回 passed / issues / checked</text><text x="1210" y="1227" class="body">无效输出或服务失败视为未通过</text></g><g class="node" data-node="vfinalfiles" role="button" tabindex="0"><title>核对最终文件一致性；本地截图的源 SHA 与快照一致；验收前后项目文件不能再变化；实际检查与问题合并形成结论</title><rect x="530" y="1210" width="540" height="135" rx="14" fill="#fff3dc" stroke="#d1af69" stroke-width="1.8"/><rect x="530" y="1224" width="5" height="107" rx="2" fill="#896222"/><text x="550" y="1245" class="title">核对最终文件一致性</text><text x="550" y="1276" class="body">本地截图的源 SHA 与快照一致</text><text x="550" y="1303" class="body">验收前后项目文件不能再变化</text><text x="550" y="1330" class="body">实际检查与问题合并形成结论</text></g><g class="node" data-node="vpassed" role="button" tabindex="0"><title>独立验收全部通过？</title><path d="M800 1450L990 1507.5L800 1565L610 1507.5Z" fill="#fff3dc" stroke="#d1af69" stroke-width="2"/><text x="800" y="1514.5" text-anchor="middle" class="title">独立验收全部通过？</text></g><g class="node" data-node="vbudget" role="button" tabindex="0"><title>失败：检查修复预算；默认最多修复 2 次；保留每轮检查与问题历史；SDK 异常不进入此循环；总执行时间及 SDK 轮数仍约束</title><rect x="60" y="1440" width="340" height="165" rx="14" fill="#fff3dc" stroke="#d1af69" stroke-width="1.8"/><rect x="60" y="1454" width="5" height="137" rx="2" fill="#896222"/><text x="80" y="1475" class="title">失败：检查修复预算</text><text x="80" y="1506" class="body">默认最多修复 2 次</text><text x="80" y="1533" class="body">保留每轮检查与问题历史</text><text x="80" y="1560" class="body">SDK 异常不进入此循环</text><text x="80" y="1587" class="body">总执行时间及 SDK 轮数仍约束</text></g><g class="node" data-node="vfeedback" role="button" tabindex="0"><title>反馈给同一 SDK 会话；真实错误输出＋实际截图；保留固定命令与原验收标准；按原标准修复，再验收</title><rect x="60" y="1690" width="340" height="140" rx="14" fill="#eceefa" stroke="#929fce" stroke-width="1.8"/><rect x="60" y="1704" width="5" height="112" rx="2" fill="#465e9c"/><text x="80" y="1725" class="title">反馈给同一 SDK 会话</text><text x="80" y="1756" class="body">真实错误输出＋实际截图</text><text x="80" y="1783" class="body">保留固定命令与原验收标准</text><text x="80" y="1810" class="body">按原标准修复，再验收</text></g><g class="node" data-node="vresume" role="button" tabindex="0"><title>原 Agent 继续执行；同一个 ClaudeSDKClient；修改后再次进入独立验收；见图 3 的执行与工具循环</title><rect x="60" y="1925" width="340" height="130" rx="14" fill="#eceefa" stroke="#929fce" stroke-width="1.8"/><rect x="60" y="1939" width="5" height="102" rx="2" fill="#465e9c"/><text x="80" y="1960" class="title">原 Agent 继续执行</text><text x="80" y="1991" class="body">同一个 ClaudeSDKClient</text><text x="80" y="2018" class="body">修改后再次进入独立验收</text><text x="80" y="2045" class="body">见图 3 的执行与工具循环</text></g><g class="node" data-node="vexhaust" role="button" tabindex="0"><title>修复次数耗尽；status=verification_failed；保留历史、实际问题与已有改动；主助手确定性报告未完成</title><rect x="60" y="2175" width="340" height="145" rx="14" fill="#fff0ed" stroke="#ca8c80" stroke-width="1.8"/><rect x="60" y="2189" width="5" height="117" rx="2" fill="#a24838"/><text x="80" y="2210" class="title">修复次数耗尽</text><text x="80" y="2241" class="body">status=verification_failed</text><text x="80" y="2268" class="body">保留历史、实际问题与已有改动</text><text x="80" y="2295" class="body">主助手确定性报告未完成</text></g><g class="node" data-node="vcompleted" role="button" tabindex="0"><title>验收通过：完成编码验收；status=completed；verification.passed=true；保存本次实际验收截图</title><rect x="530" y="1710" width="540" height="135" rx="14" fill="#e7f5ed" stroke="#70aa86" stroke-width="1.8"/><rect x="530" y="1724" width="5" height="107" rx="2" fill="#2c7448"/><text x="550" y="1745" class="title">验收通过：完成编码验收</text><text x="550" y="1776" class="body">status=completed</text><text x="550" y="1803" class="body">verification.passed=true</text><text x="550" y="1830" class="body">保存本次实际验收截图</text></g><g class="node" data-node="vattachments" role="button" tabindex="0"><title>HTTP 应用 URL 可以截图验收；自动原件附件主要针对已验收的本地 HTML/SVG。附件归属与读取权限仍检查当前用户。</title><rect x="530" y="1935" width="540" height="190" rx="14" fill="#e7f5ed" stroke="#70aa86" stroke-width="1.8"/><rect x="530" y="1949" width="5" height="162" rx="2" fill="#2c7448"/><text x="550" y="1970" class="title">尝试创建实际附件</text><text x="550" y="2001" class="body">本地 HTML/SVG 读取原件</text><text x="550" y="2028" class="body">与已验收源 SHA256 比对</text><text x="550" y="2055" class="body">保存到当前用户 OWUI 文件存储</text><text x="550" y="2082" class="body">SVG 使用 image/svg+xml＋图片预览</text><text x="550" y="2109" class="body">普通程序文件主要保留在工作区</text></g><g class="node" data-node="vdelivery" role="button" tabindex="0"><title>附件交付是否有错误？</title><path d="M800 2220L990 2277.5L800 2335L610 2277.5Z" fill="#fff3dc" stroke="#d1af69" stroke-width="2"/><text x="800" y="2284.5" text-anchor="middle" class="title">附件交付是否有错误？</text></g><g class="node" data-node="vdeliveryerr" role="button" tabindex="0"><title>交付未完成：明确说明；返回 delivery_errors；status 当前仍可能是 completed；不给错误文件生成预览；当前没有自动交付重试循环</title><rect x="1190" y="2220" width="360" height="155" rx="14" fill="#fff0ed" stroke="#ca8c80" stroke-width="1.8"/><rect x="1190" y="2234" width="5" height="127" rx="2" fill="#a24838"/><text x="1210" y="2255" class="title">交付未完成：明确说明</text><text x="1210" y="2286" class="body">返回 delivery_errors</text><text x="1210" y="2313" class="body">status 当前仍可能是 completed</text><text x="1210" y="2340" class="body">不给错误文件生成预览</text><text x="1210" y="2367" class="body">当前没有自动交付重试循环</text></g><g class="node" data-node="vreport" role="button" tabindex="0"><title>主助手回复实际结果；测试、改动、验收记录；可用附件、预览和截图；区分验收完成与附件交付完成</title><rect x="530" y="2435" width="540" height="145" rx="14" fill="#e7f0fa" stroke="#719dc7" stroke-width="1.8"/><rect x="530" y="2449" width="5" height="117" rx="2" fill="#205984"/><text x="550" y="2470" class="title">主助手回复实际结果</text><text x="550" y="2501" class="body">测试、改动、验收记录</text><text x="550" y="2528" class="body">可用附件、预览和截图</text><text x="550" y="2555" class="body">区分验收完成与附件交付完成</text></g><text x="40" y="2632" style="font-size:18px;fill:#60778a">默认：1 次初验＋最多 2 次修复＝最多 3 轮验收。UI 项目可能同时需要测试与截图，不能把两类检查画成永远互斥。</text><text x="40" y="2659" style="font-size:18px;fill:#60778a">附件失败目前仅返回 delivery_errors，不会把 completed 自动改为 failed；普通代码不保证自动生成下载附件。</text></svg>
