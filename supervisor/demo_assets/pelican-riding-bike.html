<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>海风骑行 · 鹈鹕的小假日</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body { min-height: 100svh; display: grid; place-items: center; background: #f4f5f3; }
    main { width: min(1100px, calc(100% - 48px)); padding: 24px 0; }
    .canvas { width: min(100%, calc((100svh - 80px) * 1.4815)); margin: auto; aspect-ratio: 1200 / 810; overflow: hidden; border: 1px solid #d1d9d7; border-radius: 8px; background: #dcebee; }
    #scene { display: block; width: 100%; height: 100%; }
    .cloud { transform-box: view-box; animation: cloud-drift 17s ease-in-out infinite alternate; }
    .cloud.slow { animation-duration: 23s; animation-direction: alternate-reverse; }
    .scarf-tail { transform-box: view-box; transform-origin: 568px 307px; animation: scarf-breeze 2.8s ease-in-out infinite; }
    #eye { transform-box: fill-box; transform-origin: center; animation: blink 5.7s infinite; }
    #road-marks { animation: road-pass 1.8s linear infinite; }
    @keyframes cloud-drift { from { transform: translateX(-9px); } to { transform: translateX(14px); } }
    @keyframes scarf-breeze { 0%, 100% { transform: rotate(-3deg); } 50% { transform: rotate(4deg); } }
    @keyframes blink { 0%, 43%, 47%, 100% { transform: scaleY(1); } 45% { transform: scaleY(.07); } }
    @keyframes road-pass { to { stroke-dashoffset: 140; } }
    @media (max-width: 600px) {
      main { width: calc(100% - 28px); padding: 20px 0; }
      .canvas { width: 100%; aspect-ratio: 640 / 690; border-radius: 8px; }
    }
    @media (prefers-reduced-motion: reduce) { .cloud, .scarf-tail, #eye, #road-marks { animation: none; } }
  </style>
</head>

  </main>
  <script>
    (() => {
      const scene = document.getElementById("scene");
      const small = window.matchMedia("(max-width: 600px)");
      const reduced = window.matchMedia("(prefers-reduced-motion: reduce)");
      const front = ["leg-front", "foot-front", "pedal-front"].map(id => document.getElementById(id));
      const back = ["leg-back", "foot-back", "pedal-back"].map(id => document.getElementById(id));
      const wheels = ["wheel-front", "wheel-back"].map(id => document.getElementById(id));
      const crank = document.getElementById("crank");
      let animation = 0;
      let startTime;
      function layout() {
        scene.setAttribute("viewBox", small.matches ? "250 115 640 690" : "0 0 1200 810");
        document.getElementById("sun").setAttribute("transform", small.matches ? "translate(-185 20)" : "translate(0 0)");
      }
      function leg(parts, hipX, hipY, angle) {
        const x = 565 + 37 * Math.cos(angle), y = 615 + 37 * Math.sin(angle);
        const dx = x - hipX, dy = y - hipY, distance = Math.hypot(dx, dy);
        const along = (distance * distance + 108 * 108 - 112 * 112) / (2 * distance);
        const bend = Math.sqrt(Math.max(0, 108 * 108 - along * along));
        const kneeX = hipX + dx * along / distance + dy * bend / distance;
        const kneeY = hipY + dy * along / distance - dx * bend / distance;
        parts[0].setAttribute("d", `M${hipX} ${hipY}L${kneeX.toFixed(2)} ${kneeY.toFixed(2)}L${x.toFixed(2)} ${y.toFixed(2)}`);
        for (const part of parts.slice(1)) part.setAttribute("transform", `translate(${x.toFixed(2)} ${y.toFixed(2)})`);
      }
      function pose(angle) {
        leg(front, 542, 446, angle);
        leg(back, 526, 444, angle + Math.PI);
        crank.setAttribute("transform", `rotate(${angle * 180 / Math.PI} 565 615)`);
        for (const wheel of wheels) wheel.setAttribute("transform", `rotate(${angle * 180 / Math.PI * 1.6})`);
      }
      function frame(time) {
        if (startTime === undefined) startTime = time;
        pose((time - startTime) / 1800 * Math.PI * 2);
        animation = requestAnimationFrame(frame);
      }
      function motion() {
        cancelAnimationFrame(animation);
        startTime = undefined;
        if (reduced.matches) pose(-.35);
        else animation = requestAnimationFrame(frame);
      }
      small.addEventListener("change", layout);
      reduced.addEventListener("change", motion);
      document.addEventListener("visibilitychange", () => {
        if (document.hidden) cancelAnimationFrame(animation);
        else motion();
      });
      layout();
      motion();
    })();
  </script>
</body>
</html>
