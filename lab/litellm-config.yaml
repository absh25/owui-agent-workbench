model_list:
  - model_name: agent-model
    litellm_params:
      model: os.environ/UPSTREAM_MODEL
      api_base: os.environ/UPSTREAM_API_BASE
      api_key: os.environ/UPSTREAM_API_KEY
      use_chat_completions_api: true
      drop_params: true

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY

litellm_settings:
  drop_params: true
  request_timeout: 600
