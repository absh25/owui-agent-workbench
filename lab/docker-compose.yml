name: owui-claude-agent-lab

services:
  open-terminal:
    build:
      context: .
      dockerfile: Dockerfile.open-terminal
    image: owui-claude-agent-lab/open-terminal:slim
    environment:
      OPEN_TERMINAL_API_KEY: ${OPEN_TERMINAL_API_KEY}
      HOME: /workspace/wenguang.wu
      OPEN_TERMINAL_FILE_BROWSER_ROOT: /workspace/wenguang.wu
      OPEN_TERMINAL_FILE_BROWSER_LABEL: wenguang.wu
    working_dir: /workspace/wenguang.wu
    volumes:
      - open-terminal-wenguang-wu:/workspace/wenguang.wu
    ports:
      - "127.0.0.1:18002:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 10
    # Office conversion needs more headroom than the original slim image.
    mem_limit: 2g
    cpus: 2.0
    pids_limit: 256
    restart: unless-stopped

  verification-browser:
    build:
      context: ../verification_browser
    image: owui-claude-agent-lab/verification-browser:1.63.0
    environment:
      OPEN_TERMINAL_API_KEY: ${OPEN_TERMINAL_API_KEY}
      VERIFICATION_WORKSPACE: /workspace/wenguang.wu
    volumes:
      - open-terminal-wenguang-wu:/workspace/wenguang.wu:ro
    init: true
    shm_size: 256m
    mem_limit: 1g
    cpus: 2.0
    pids_limit: 256
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8088/health',timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  weather-mcp:
    image: owui-claude-agent-lab/open-webui:v0.11.4
    entrypoint: ["python", "/weather/server.py"]
    volumes:
      - ./weather-mcp/server.py:/weather/server.py:ro
    ports:
      - "127.0.0.1:18001:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import socket; s=socket.create_connection(('127.0.0.1',8000),2); s.close()",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  jira-mcp:
    image: owui-claude-agent-lab/open-webui:v0.11.4
    entrypoint: ["python", "/jira/server.py"]
    working_dir: /jira
    environment:
      JIRA_BASE_URL: ${JIRA_BASE_URL:-https://your-company.atlassian.net}
      JIRA_EMAIL: ${JIRA_EMAIL:-}
      JIRA_API_TOKEN: ${JIRA_API_TOKEN:-}
    volumes:
      - ./jira-mcp/server.py:/jira/server.py:ro
      - ./jira-mcp/jira_client.py:/jira/jira_client.py:ro
    ports:
      - "127.0.0.1:18003:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import socket; s=socket.create_connection(('127.0.0.1',8000),2); s.close()",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  retrieval-lab:
    build:
      context: ../retrieval_lab
    image: owui-claude-agent-lab/retrieval:0.1
    entrypoint: ["python", "-m", "retrieval_lab.server"]
    working_dir: /ragflow
    environment:
      PYTHONPATH: /ragflow
      RAGFLOW_DATA_DIR: /data
      RAGFLOW_MCP_TOKEN: ${RAGFLOW_MCP_TOKEN}
      DASHSCOPE_API_KEY: ${RAGFLOW_DASHSCOPE_API_KEY:-}
      DASHSCOPE_BASE_URL: ${RAGFLOW_DASHSCOPE_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      DASHSCOPE_EMBEDDING_MODEL: ${RAGFLOW_EMBEDDING_MODEL:-text-embedding-v4}
    volumes:
      - ../retrieval_lab:/ragflow/retrieval_lab:ro
      - ../tests:/ragflow/tests:ro
      - retrieval-lab-data:/data
    ports:
      - "127.0.0.1:18004:8000"
    mem_limit: 384m
    cpus: 1.0
    pids_limit: 96
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  open-webui:
    build:
      context: ..
      dockerfile: lab/Dockerfile.openwebui
    image: owui-claude-agent-lab/open-webui:v0.11.4
    environment:
      WEBUI_AUTH: "true"
      ENABLE_SIGNUP: "true"
      ENABLE_EVALUATION_ARENA_MODELS: "false"
      WEBUI_SECRET_KEY: ${WEBUI_SECRET_KEY}
      ANTHROPIC_BASE_URL: ${UPSTREAM_API_BASE}
      ANTHROPIC_API_KEY: ${UPSTREAM_API_KEY}
      ANTHROPIC_MODEL: ${UPSTREAM_MODEL}
      OPEN_TERMINAL_API_KEY: ${OPEN_TERMINAL_API_KEY}
      OPEN_TERMINAL_OWNER_NAME: ${OPEN_TERMINAL_OWNER_NAME:-wenguang.wu}
      VERIFICATION_BROWSER_URL: http://verification-browser:8088
      RAGFLOW_MCP_TOKEN: ${RAGFLOW_MCP_TOKEN}
      PYTHONPATH: /app/backend:/lab
      TOOL_GOVERNANCE_ENABLED: "true"
      TOOL_GOVERNANCE_POLICY: /lab/policies/tool-governance.yaml
      TOOL_GOVERNANCE_JIRA_WORKFLOW: /lab/policies/jira-workflow.yaml
      TOOL_GOVERNANCE_DATABASE: /app/backend/data/tool-governance.sqlite3
      TOOL_GOVERNANCE_APPROVAL_PROJECT: ${TOOL_GOVERNANCE_APPROVAL_PROJECT:-OWUI}
      TOOL_GOVERNANCE_GROUP_ADMIN_IDS: '${TOOL_GOVERNANCE_GROUP_ADMIN_IDS:-{}}'
      DISABLE_PROMPT_CACHING: "1"
      DISABLE_AUTOUPDATER: "1"
      DISABLE_TELEMETRY: "1"
      DISABLE_ERROR_REPORTING: "1"
    volumes:
      - open-webui-data:/app/backend/data
      - ../claude_agent_pipe.py:/lab/claude_agent_pipe.py:ro
      - ../governance:/lab/governance:ro
      - ../supervisor:/lab/supervisor:ro
      - ../retrieval_lab:/lab/retrieval_lab:ro
      - ../policies:/lab/policies:ro
      - ../tests:/lab/tests:ro
      - ./jira-mcp:/lab/jira-mcp:ro
      - ./register_open_terminal.py:/lab/register_open_terminal.py:ro
      - ./register_jira_mcp.py:/lab/register_jira_mcp.py:ro
      - ./sync_openwebui_function.py:/lab/sync_openwebui_function.py:ro
      - ./test_jira_mcp.py:/lab/test_jira_mcp.py:ro
      - ./test_open_terminal.py:/lab/test_open_terminal.py:ro
      - ./smoke_test_terminal_agent.py:/lab/smoke_test_terminal_agent.py:ro
      - ./probe_sdk_mcp.py:/lab/probe_sdk_mcp.py:ro
    ports:
      - "127.0.0.1:13000:8080"
    extra_hosts:
      - host.docker.internal:host-gateway
    restart: unless-stopped
    depends_on:
      weather-mcp:
        condition: service_healthy
      jira-mcp:
        condition: service_healthy
      open-terminal:
        condition: service_healthy

volumes:
  open-webui-data:
  # Previous workspace kept for rollback and removed by remove-lab.ps1.
  open-terminal-data:
  open-terminal-wenguang-wu:
  retrieval-lab-data:
